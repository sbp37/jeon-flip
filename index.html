<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>전 뒤집기</title>
<meta name="description" content="노릇노릇할 때 탭! 60초 안에 전을 최대한 많이 뒤집는 1탭 타이밍 미니게임">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f8f1e4; --paper:#fdf6e9; --brown:#6b4a2f; --brown-d:#4a3018;
  --orange:#f08a2d; --green:#7cb342; --red:#e05b3a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
.srOnly{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
button:focus-visible,.typeCard:focus-visible{outline:4px solid #2367c9;outline-offset:3px}
body{
  background:#e8d5b4 url('assets/bg-table.webp') center/cover no-repeat fixed;
  font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  color:var(--brown-d); user-select:none; -webkit-user-select:none;
  touch-action:manipulation; overflow:hidden;
}
#app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ── HUD ─────────────────────────────── */
#hud{display:flex;gap:8px;padding:12px 56px 6px}
.stat{flex:1;background:var(--paper);border:3px solid #c9a875;border-radius:16px;padding:5px 4px 7px;text-align:center;box-shadow:0 4px 0 #b8946a}
.stat .label{font-size:14px;color:#a08464}
.stat .value{font-size:30px;color:#5b3a1e;line-height:1.1}
#statTime .value.low{color:var(--red);animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#statCombo .value{color:var(--orange)}
#statCombo.hot .value{animation:pulse .4s infinite}
#statusStrip{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:2px 14px 0;padding:4px 10px;
  min-height:31px;background:rgba(253,246,233,.92);border:2px solid #c9a875;border-radius:999px;box-shadow:0 2px 0 #b8946a;font-size:13px}
#rushBadge{color:#6b4a2f;white-space:nowrap}
#perfectTrack{display:flex;align-items:center;gap:4px;color:#8a6a45;white-space:nowrap}
.pip{width:10px;height:10px;border:2px solid #d8bd8f;border-radius:50%;background:#f3e6cc}
.pip.on{background:#ffd54a;border-color:#e8a52a;box-shadow:0 0 6px #ffd54a}
#scoreMulti{min-width:34px;text-align:right;color:var(--orange);font-size:16px;white-space:nowrap}
#statusStrip.fever{background:#fff0b8;border-color:#f0a02d;animation:feverGlow .45s ease-in-out infinite alternate}
#statusStrip.fever #perfectTrack{color:#c55f0e;font-size:15px}
@keyframes feverGlow{to{box-shadow:0 0 15px #ffd54a,0 2px 0 #c55f0e}}

/* 장사 단계와 마감 압박 */
#rushCurtain{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;box-shadow:inset 0 0 0 0 rgba(220,45,20,0)}
#app.finalRush #rushCurtain{opacity:1;animation:dangerEdge 1s ease-in-out infinite}
#app.feverMode #rushCurtain{opacity:1;box-shadow:inset 0 0 42px rgba(255,196,40,.28)}
@keyframes dangerEdge{50%{box-shadow:inset 0 0 55px 13px rgba(220,45,20,.38)}}
#countdownBurst{position:fixed;left:50%;top:50%;z-index:9;pointer-events:none;opacity:0;
  color:#fff4bd;font-size:min(32vw,150px);line-height:1;text-shadow:0 8px 0 #b82e1c,0 0 30px rgba(255,90,30,.75)}
#countdownBurst.show{animation:countdownBoom .78s ease-out}
@keyframes countdownBoom{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}}

/* ── 아주머니 + 말풍선 ─────────────────── */
#ajRow{display:flex;align-items:center;gap:10px;padding:2px 16px;min-height:70px}
#ajImg{width:60px;height:60px;border-radius:50%;border:3px solid #c9a875;background:var(--paper);object-fit:cover;flex:none;box-shadow:0 3px 0 #b8946a}
#bubble{position:relative;background:#fffdf6;border:3px solid #c9a875;border-radius:18px;padding:7px 14px;font-size:19px;color:#5b3a1e;line-height:1.3;max-width:78%}
#bubble::before{content:'';position:absolute;left:-10px;top:17px;width:14px;height:14px;background:#fffdf6;border-left:3px solid #c9a875;border-bottom:3px solid #c9a875;transform:rotate(45deg)}
#bubble.pop{animation:bubblePop .25s ease-out}
@keyframes bubblePop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ── 팬 영역 ─────────────────────────── */
#playArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 16px;min-height:0}
#gaugeWrap{width:min(80vw,360px);margin-bottom:-10px}
#gauge{width:100%;display:block}
#gauge text{font-size:15px;font-family:'Jua';fill:#7a5c3a}
#typeBadge{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;font-size:17px;padding:3px 16px;border-radius:999px;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.2);opacity:0;transition:opacity .2s}
#typeBadge.on{opacity:1}
#panWrap{position:relative;width:min(72vw,340px);aspect-ratio:1;flex:none}
#panImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(80,50,20,.4))}
#panImg.shake{animation:panShake .4s ease-in-out}
@keyframes panShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
#jeonStack{position:absolute;inset:0;transform-origin:center}
#jeonStack.drop{animation:jeonDrop .55s ease-out}
@keyframes jeonDrop{0%{transform:scale(.25);opacity:.4}60%{transform:scale(1.05)}100%{transform:scale(1)}}
#jeonStack.sizzle{animation:sizzleWob .5s ease-in-out infinite}
#jeonStack.sizzle.fast{animation-duration:.26s}
@keyframes sizzleWob{0%,100%{transform:scale(1) rotate(0deg)}30%{transform:scale(1.012) rotate(.5deg)}70%{transform:scale(.998) rotate(-.4deg)}}
#jeonStack.flipGood{animation:flipGood .6s ease-out}
@keyframes flipGood{30%{transform:translateY(-15%) scale(1.06) rotate(7deg)}100%{transform:translateY(0) scale(1)}}
#jeonStack.flipBad{animation:flipBad .5s ease-out}
@keyframes flipBad{30%{transform:translateY(-6%) scale(.98)}100%{transform:translateY(0) scale(1)}}
#jeonStack.burnShake{animation:burnShake .5s ease-in-out}
@keyframes burnShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.jstage{position:absolute;left:50%;top:50%;width:71%;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.steam{position:absolute;width:16px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.8),transparent 70%);
  opacity:0;pointer-events:none}
.steam.s1{left:38%;top:18%}.steam.s2{left:56%;top:22%}.steam.s3{left:47%;top:10%}
.steam.on{animation:steamUp 1.4s ease-out infinite}
.steam.on.s2{animation-delay:.45s}.steam.on.s3{animation-delay:.9s}
@keyframes steamUp{0%{opacity:0;transform:translateY(0) scale(.7)}25%{opacity:.9}100%{opacity:0;transform:translateY(-70px) scale(1.5)}}
.smoke{position:absolute;width:30px;height:40px;border-radius:50%;left:45%;top:12%;
  background:radial-gradient(ellipse,rgba(70,65,60,.75),transparent 70%);opacity:0;pointer-events:none}
.smoke.on{animation:steamUp 1.1s ease-out infinite}
#nowHint{position:absolute;top:-30px;left:50%;transform:translateX(-50%) scale(0);
  background:var(--orange);color:#fff;font-size:21px;padding:5px 18px;border-radius:999px;
  box-shadow:0 3px 0 #c55f0e;transition:transform .15s;z-index:4;white-space:nowrap}
#nowHint.on{transform:translateX(-50%) scale(1);animation:nowPulse .4s infinite}
@keyframes nowPulse{50%{transform:translateX(-50%) scale(1.1)}}

/* 결과 토스트 */
#toast{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:36px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);
  z-index:5;white-space:nowrap;pointer-events:none}
#toast.show{animation:toastPop 1s ease-out forwards}
@keyframes toastPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
#toast.good{color:#ffe28a}
#toast.bad{color:#efe6d8}
#scorePop{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:28px;color:#5da02c;opacity:0;pointer-events:none;z-index:5;text-shadow:0 2px 0 #fff}
#scorePop.show{animation:scoreUp .9s ease-out forwards}
@keyframes scoreUp{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}

/* 화면 플래시 */
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
#flash.good{background:radial-gradient(circle,rgba(255,190,60,.28),transparent 70%);animation:flashA .45s ease-out}
#flash.bad{background:radial-gradient(circle,rgba(60,50,40,.3),transparent 70%);animation:flashA .45s ease-out}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}

/* ── 탭! 원형 버튼 ────────────────────── */
#flipBtn{display:block;width:min(42vw,150px);aspect-ratio:560/518;margin:2px auto 16px;border:none;background:transparent;
  background-image:url('assets/btn-round.webp');background-size:contain;background-repeat:no-repeat;background-position:center;
  color:#fff;font-family:inherit;font-size:46px;letter-spacing:2px;line-height:1;
  text-shadow:0 3px 0 rgba(120,55,0,.6);cursor:pointer;filter:drop-shadow(0 7px 7px rgba(120,60,10,.4))}
#flipBtn:active{transform:scale(.93);filter:drop-shadow(0 2px 3px rgba(120,60,10,.4))}
#flipBtn .sub{display:block;font-size:14px;opacity:.95;margin-top:6px;letter-spacing:0}
#tapHint{text-align:center;font-size:14px;color:#8a6a45;margin-top:-10px;margin-bottom:14px}
#flipBtn:disabled{filter:grayscale(.5) brightness(.92)}

/* 불꽃 */
#flameWrap{position:absolute;inset:-13%;z-index:0;transform-origin:50% 62%;transition:transform .6s}
#flames{width:100%;height:100%;object-fit:contain;
  pointer-events:none;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.85;transform:scale(1)}100%{opacity:1;transform:scale(1.03)}}

/* 3D 뒤집기 + 서빙 */
#panWrap{perspective:700px}
#jeonStack{transform-style:preserve-3d}
#jeonStack.flip3d{animation:flip3d .52s ease-in-out}
@keyframes flip3d{0%{transform:rotateX(0)}35%{transform:rotateX(200deg) translateY(-26%) scale(1.08)}100%{transform:rotateX(360deg)}}
#jeonStack.toPlate{animation:toPlate .6s ease-in forwards}
@keyframes toPlate{20%{transform:translateY(-9%) scale(1.03)}100%{transform:translate(52%,55%) scale(.22);opacity:0}}

/* 파티클 */
.pt{position:absolute;left:50%;top:44%;width:11px;height:11px;margin:-5px;border-radius:50%;
  background:radial-gradient(circle,#ffe9a0,#f0a02d);pointer-events:none;z-index:6;
  animation:ptFly .75s ease-out forwards}
.pt.g{background:radial-gradient(circle,#fff,#ffd76a);box-shadow:0 0 9px #ffd76a;width:13px;height:13px}
@keyframes ptFly{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}

/* 완성 접시 */
#plate{position:absolute;right:-9%;bottom:-7%;width:38%;opacity:0;transition:opacity .3s;z-index:2;pointer-events:none}
#plate.on{opacity:1}
#plate img{width:100%;display:block;filter:drop-shadow(0 6px 8px rgba(80,50,20,.35))}
#plate.bump img{animation:plateBump .4s}
@keyframes plateBump{40%{transform:scale(1.12)}}
#plateCnt{position:absolute;right:2%;top:-6px;background:var(--orange);color:#fff;font-size:15px;
  padding:1px 10px;border-radius:999px;box-shadow:0 2px 0 #c55f0e}

/* 상단 조작 버튼 */
#pauseBtn,#sfxBtn{position:absolute;top:calc(12px + env(safe-area-inset-top));z-index:20;width:42px;height:42px;border-radius:50%;
  border:3px solid #c9a875;background:var(--paper);font-size:18px;cursor:pointer;
  box-shadow:0 3px 0 #b8946a;font-family:inherit;line-height:1}
#pauseBtn{left:12px}#sfxBtn{right:12px}
#pauseBtn:active,#sfxBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8946a}
.iconPause{display:block;position:relative;width:16px;height:19px;margin:auto}
.iconPause::before,.iconPause::after{content:'';position:absolute;top:1px;width:5px;height:17px;border-radius:2px;background:#6b4a2f}
.iconPause::before{left:1px}.iconPause::after{right:1px}
#sfxBtn svg{display:block;width:24px;height:24px;margin:auto;overflow:visible}
#sfxBtn .soundWave{fill:none;stroke:#6b4a2f;stroke-width:2.2;stroke-linecap:round}
#sfxBtn .muteSlash{display:none;stroke:#c94d35;stroke-width:2.8;stroke-linecap:round}
#sfxBtn.muted .soundWave{display:none}#sfxBtn.muted .muteSlash{display:block}

/* 전 선택 카드 */
.selRow{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.typeCard{flex:1;max-width:110px;border:3px solid #d8bd8f;border-radius:16px;padding:8px 6px 9px;
  background:#fdf3df;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s;font-family:inherit;color:inherit}
.typeCard img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#f0e0c2}
.typeCard .tn{display:block;font-size:17px;color:#5b3a1e;margin-top:4px;line-height:1.2}
.typeCard .tt{display:block;font-size:12px;color:#a08464;line-height:1.25;margin-top:2px;font-family:'Pretendard','Noto Sans KR',sans-serif;font-weight:600;word-break:keep-all}
.typeCard.sel{border-color:var(--orange);background:#ffeccf;transform:translateY(-4px);box-shadow:0 5px 0 #d8955a}
.card .ajBig{width:104px;height:104px;border-radius:50%;border:3px solid #c9a875;object-fit:cover;margin-top:-58px;background:var(--paper)}
#homeBtn{display:block;margin:10px auto 0;background:none;border:none;color:#8a6a45;font-size:16px;font-family:inherit;cursor:pointer;text-decoration:underline}

/* ── 오버레이 ────────────────────────── */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(60,40,20,.5);backdrop-filter:blur(2px);padding:20px}
.overlay.hidden{display:none}
.card{width:100%;max-width:400px;background:var(--paper);border:3px solid #c9a875;border-radius:26px;
  padding:24px 22px;text-align:center;box-shadow:0 16px 40px rgba(60,40,10,.4)}
.card .titleImg{width:78%;max-width:290px;margin:0 auto 4px;display:block}
.card .stackImg{width:150px;margin:0 auto;display:block}
.card .sub{font-size:19px;color:#8a6a45;margin:6px 0 12px;line-height:1.5}
.typeChips{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.typeChips span{background:#f3e6cc;border:2px solid #d8bd8f;border-radius:999px;padding:5px 14px;font-size:17px;color:#7a5a30}
.bigBtn{display:block;width:100%;height:92px;margin-top:8px;border:none;background:transparent;
  background-size:100% 100%;background-repeat:no-repeat;color:#5b3a1e;font-family:inherit;
  font-size:34px;letter-spacing:1px;cursor:pointer;filter:drop-shadow(0 5px 5px rgba(120,60,10,.3))}
.bigBtn:active{transform:translateY(4px);filter:drop-shadow(0 1px 2px rgba(120,60,10,.3))}
.bigBtn.yellow{background-image:url('assets/btn-wide-yellow.webp')}
.bigBtn.green{background-image:url('assets/btn-wide-green.webp');color:#3f5423}
.pauseCard{max-width:360px}
.pauseCard h1{font-size:38px;color:#5b3a1e}
#pauseSummary{font-size:19px;color:#8a6a45;margin:8px 0 14px}
.pauseMenu{display:grid;gap:5px}
.menuBtn{width:100%;min-height:58px;border:0;background:transparent url('assets/btn-wide-yellow.webp') center/100% 100% no-repeat;color:#5b3a1e;
  font-family:inherit;font-size:21px;cursor:pointer;filter:drop-shadow(0 4px 4px rgba(120,60,10,.24))}
.menuBtn.primary{background-image:url('assets/btn-wide-green.webp');color:#3f5423}
.menuBtn.danger{background-image:url('assets/btn-wide-orange.webp');color:#6b2c14}
.menuBtn:active{transform:translateY(3px);filter:drop-shadow(0 1px 2px rgba(120,60,10,.22))}
#pauseConfirm{padding:12px 0 2px}
#pauseConfirm.hidden,#pauseMenu.hidden{display:none}
#pauseConfirmText{font-size:22px;line-height:1.35;margin-bottom:14px}
.confirmRow{display:flex;gap:10px}
.confirmRow .menuBtn{flex:1}
#endReason{display:inline-block;background:#f3e6cc;color:#8a6a45;border-radius:999px;padding:3px 13px;font-size:14px;margin-bottom:4px}
#endScore{font-size:58px;color:var(--orange);line-height:1.1}
#endCount{font-size:20px;color:#5b3a1e}
#endCombo{font-size:17px;color:#8a6a45;margin-top:2px}
.bestLine{font-size:17px;color:#8a6a45;margin:4px 0 8px}
.bestLine.record{color:var(--orange);animation:bubblePop .35s ease-out}
#stars{font-size:40px;letter-spacing:6px;margin:4px 0;color:#e8a52a}
#stars .off{opacity:.25}
.hintLine{font-size:15px;color:#a08464;margin-top:10px;line-height:1.6;font-family:'Pretendard','Noto Sans KR',sans-serif;font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #flames{animation:none}
}

@media (max-height: 720px){
  #hud{padding:8px 56px 4px}
  #pauseBtn,#sfxBtn{top:calc(8px + env(safe-area-inset-top));width:38px;height:38px}
  #statusStrip{min-height:27px;margin-top:0;padding:2px 9px;font-size:12px}
  .stat{padding:3px 2px 5px;border-radius:12px}
  .stat .value{font-size:24px}
  .stat .label{font-size:12px}
  #ajRow{min-height:54px;padding:0 14px}
  #ajImg{width:46px;height:46px}
  #bubble{font-size:16px;padding:5px 12px}
  #gaugeWrap{width:min(64vw,280px,26dvh)}
  #panWrap{width:min(64vw,280px,38dvh)}
  #flipBtn{width:min(34vw,120px);font-size:36px;margin:0 auto 10px}
  #flipBtn .sub{font-size:12px}
  .card{padding:18px 16px;max-height:94dvh;overflow:auto}
  .card .ajBig{margin-top:0;width:88px;height:88px}
  .card .stackImg{width:110px}
  .bigBtn{height:74px;font-size:27px}
  #endScore{font-size:44px}
  #stars{font-size:32px}
}
@media (max-height: 640px){
  #startOv .ajBig{display:none}
  #startOv .hintLine{font-size:13px;line-height:1.35;margin-top:5px}
}
</style>
</head>
<body>
<div id="app" inert>
  <header id="hud" aria-label="게임 현황">
    <div class="stat"><div class="label">점수</div><output class="value" id="vScore" aria-label="현재 점수">0</output></div>
    <div class="stat" id="statTime"><div class="label">시간</div><output class="value" id="vTime" aria-label="남은 시간(초)">60</output></div>
    <div class="stat" id="statCombo"><div class="label">콤보</div><output class="value" id="vCombo" aria-label="현재 콤보">0</output></div>
  </header>
  <div id="statusStrip" aria-live="polite">
    <span id="rushBadge">준비 영업</span>
    <span id="perfectTrack"><span id="trackLabel">황금</span><span class="pip"></span><span class="pip"></span><span class="pip"></span></span>
    <strong id="scoreMulti">x1</strong>
  </div>

  <main id="playArea">
    <div id="gaugeWrap">
      <svg id="gauge" viewBox="0 0 200 136" aria-hidden="true">
        <path id="arcRaw"   fill="none" stroke="#d9c9a8" stroke-width="15" stroke-linecap="round"/>
        <path id="arcGood"  fill="none" stroke="#7cb342" stroke-width="15" stroke-linecap="round"/>
        <path id="arcPerfect" fill="none" stroke="#ffd54a" stroke-width="15" stroke-linecap="round"/>
        <path id="arcOver"  fill="none" stroke="#e05b3a" stroke-width="15" stroke-linecap="round"/>
        <circle id="needle" r="9" fill="#fffdf6" stroke="#5b3a1e" stroke-width="3.5"/>
        <text id="gaugeLbl" x="100" y="121" text-anchor="middle">익음 정도</text>
      </svg>
    </div>
    <div id="panWrap">
      <div id="typeBadge"></div>
      <div id="nowHint">지금이야!</div>
      <div id="flameWrap"><img id="flames" src="assets/flames.webp" alt=""></div>
      <img id="panImg" src="assets/pan.webp" alt="후라이팬">
      <div id="jeonStack">

<script>
'use strict';
/* ═══════════ 사운드 (WebAudio 합성) ═══════════ */
const Sfx=(()=>{let ctx=null,master=null,crackleBuf=null,cookGain=null,cookSrc=null;
let muted=false;
try{muted=localStorage.getItem('jf_mute')==='1';}catch(e){}
function ensure(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
master=ctx.createGain();master.gain.value=muted?0:.9;master.connect(ctx.destination);}
if(ctx.state==='suspended')ctx.resume();}
function isMuted(){return muted;}
function setMuted(m){muted=m;try{localStorage.setItem('jf_mute',m?'1':'0');}catch(e){}
if(master)master.gain.value=m?0:.9;}
function noiseBuf(dur){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
// 지글지글 루프용 버퍼: 잡음 + 랜덤 튀는 팝
function crackle(dur){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
let e=0;for(let i=0;i<n;i++){if(Math.random()<.0035)e=1;e*=.994;
d[i]=(Math.random()*2-1)*(.06+e*.55);}return b;}
function pop(t,vol,f){const s=ctx.createBufferSource();s.buffer=noiseBuf(.03);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);}
// 반죽 부을 때 "치익~"
function pourSizzle(dur=.9,vol=.55){if(!ctx)return;const t=ctx.currentTime;
const s=ctx.createBufferSource();s.buffer=noiseBuf(dur);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(5200,t);
bp.frequency.exponentialRampToValueAtTime(3400,t+dur);bp.Q.value=.8;
const g=ctx.createGain();g.gain.setValueAtTime(.001,t);
g.gain.exponentialRampToValueAtTime(vol,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+dur);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
const pops=Math.floor(dur*40);for(let i=0;i<pops;i++)pop(t+Math.random()*dur,vol*(.3+Math.random()*.7),3000+Math.random()*5000);
const ls=ctx.createBufferSource();ls.buffer=noiseBuf(dur*.7);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
const lg=ctx.createGain();lg.gain.setValueAtTime(.001,t);lg.gain.exponentialRampToValueAtTime(vol*.35,t+.08);
lg.gain.exponentialRampToValueAtTime(.001,t+dur*.7);
ls.connect(lp);lp.connect(lg);lg.connect(master);ls.start(t);}
// 익는 동안 잔잔한 지글거림 루프
function cookStart(){if(!ctx)return;cookStop();
crackleBuf=crackleBuf||crackle(2.5);
cookSrc=ctx.createBufferSource();cookSrc.buffer=crackleBuf;cookSrc.loop=true;
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4200;bp.Q.value=.7;
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;
cookGain=ctx.createGain();cookGain.gain.value=0;
cookSrc.connect(bp);bp.connect(lp);lp.connect(cookGain);cookGain.connect(master);cookSrc.start();}
function cookVol(v){if(cookGain&&ctx)cookGain.gain.setTargetAtTime(v,ctx.currentTime,.1);}
function cookStop(){if(cookSrc){try{cookSrc.stop();}catch(e){}cookSrc=null;cookGain=null;}}
// 뒤집기: 휙 + 팬에 착
function flip(){if(!ctx)return;const t=ctx.currentTime;
const s=ctx.createBufferSource();s.buffer=noiseBuf(.12);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(1600,t);
bp.frequency.exponentialRampToValueAtTime(500,t+.12);bp.Q.value=1.5;
const g=ctx.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(200,t+.05);
o.frequency.exponentialRampToValueAtTime(70,t+.17);
const og=ctx.createGain();og.gain.setValueAtTime(.5,t+.05);og.gain.exponentialRampToValueAtTime(.001,t+.19);
o.connect(og);og.connect(master);o.start(t+.05);o.stop(t+.2);
pop(t+.06,.5,1400);}
function good(){if(!ctx)return;const t=ctx.currentTime;[660,880].forEach((f,i)=>{
const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
const g=ctx.createGain();const st=t+.07*i;g.gain.setValueAtTime(.001,st);
g.gain.exponentialRampToValueAtTime(.28,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.25);
o.connect(g);g.connect(master);o.start(st);o.stop(st+.3);});}
function bad(){if(!ctx)return;const t=ctx.currentTime;
const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(180,t);
o.frequency.exponentialRampToValueAtTime(80,t+.35);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;
const g=ctx.createGain();g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+.42);}
// 완벽 판정: 반짝이는 아르페지오
function perfect(){if(!ctx)return;const t=ctx.currentTime;[880,1108.7,1318.5].forEach((f,i)=>{
const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
const g=ctx.createGain();const st=t+.06*i;g.gain.setValueAtTime(.001,st);
g.gain.exponentialRampToValueAtTime(.24,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.3);
o.connect(g);g.connect(master);o.start(st);o.stop(st+.34);});}
// 주문 들어올 때 딩동
function ding(){if(!ctx)return;const t=ctx.currentTime;
const g=ctx.createGain();g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
[1568,2093].forEach(f=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;
o.connect(g);o.start(t);o.stop(t+.42);});
g.connect(master);}
// 마감 카운트다운
function tick(urgent=false){if(!ctx)return;const t=ctx.currentTime;
const o=ctx.createOscillator();o.type=urgent?'square':'sine';o.frequency.value=urgent?980:720;
const g=ctx.createGain();g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);
o.connect(g);g.connect(master);o.start(t);o.stop(t+.12);}
// 피버 시작 팡파르
function fever(){if(!ctx)return;const t=ctx.currentTime;[523.3,659.3,784,1046.5].forEach((f,i)=>{
const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;const g=ctx.createGain();const st=t+i*.07;
g.gain.setValueAtTime(.001,st);g.gain.exponentialRampToValueAtTime(.22,st+.015);g.gain.exponentialRampToValueAtTime(.001,st+.25);
o.connect(g);g.connect(master);o.start(st);o.stop(st+.28);});}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
return{ensure,isMuted,setMuted,pourSizzle,cookStart,cookVol,cookStop,flip,good,bad,perfect,ding,tick,fever,vibrate};})();

/* ═══════════ 전 종류 ═══════════ */
const TYPES=[
 {id:'buchu',name:'부추전',cookMs:4200,win:[.60,.82],win2:[.55,.80]},
 {id:'kimchi',name:'김치전',cookMs:3800,win:[.64,.78],win2:[.58,.78]},
 {id:'haemul',name:'해물전',cookMs:5200,win:[.70,.83],win2:[.62,.82]},
];

const $=id=>document.getElementById(id);
const app=$('app'),vScore=$('vScore'),vTime=$('vTime'),vCombo=$('vCombo'),statTime=$('statTime'),statCombo=$('statCombo');
const statusStrip=$('statusStrip'),rushBadge=$('rushBadge'),trackLabel=$('trackLabel'),scoreMulti=$('scoreMulti');
const perfectPips=[...document.querySelectorAll('#perfectTrack .pip')],countdownBurst=$('countdownBurst');
const bubble=$('bubble'),ajImg=$('ajImg'),typeBadge=$('typeBadge');
const panImg=$('panImg'),jeonStack=$('jeonStack'),panWrap=$('panWrap'),nowHint=$('nowHint');
const stages={raw:$('jRaw'),mid:$('jMid'),gold:$('jGold'),burnt:$('jBurnt')};
const toastEl=$('toast'),scorePop=$('scorePop'),flashEl=$('flash');
const startOv=$('startOv'),pauseOv=$('pauseOv'),endOv=$('endOv'),bestScoreEl=$('bestScore'),endBestEl=$('endBest');
const pauseMenu=$('pauseMenu'),pauseConfirm=$('pauseConfirm'),pauseSummary=$('pauseSummary');
const gaugeLbl=$('gaugeLbl'),flamesEl=$('flames'),flameWrap=$('flameWrap');
const plateEl=$('plate'),plateCnt=$('plateCnt'),pauseBtn=$('pauseBtn'),sfxBtn=$('sfxBtn');

const IMG={happy:'assets/ajumma-happy.webp',worried:'assets/ajumma-worried.webp',surprised:'assets/ajumma-surprised.webp'};

/* 게이지 arc */
const GA={cx:100,cy:100,r:72,a0:155,a1:385}; // deg, 상단을 크게 도는 호
function arcPath(t0,t1){const rad=d=>d*Math.PI/180;
const x0=GA.cx+GA.r*Math.cos(rad(GA.a0+(GA.a1-GA.a0)*t0));
const y0=GA.cy+GA.r*Math.sin(rad(GA.a0+(GA.a1-GA.a0)*t0));
const x1=GA.cx+GA.r*Math.cos(rad(GA.a0+(GA.a1-GA.a0)*t1));
const y1=GA.cy+GA.r*Math.sin(rad(GA.a0+(GA.a1-GA.a0)*t1));
const laf=(t1-t0)*(GA.a1-GA.a0)>180?1:0;return`M ${x0} ${y0} A ${GA.r} ${GA.r} 0 ${laf} 1 ${x1} ${y1}`;}
function needleAt(p){const rad=d=>d*Math.PI/180,a=GA.a0+(GA.a1-GA.a0)*p;
return[GA.cx+GA.r*Math.cos(rad(a)),GA.cy+GA.r*Math.sin(rad(a))];}
function perfectWin(w){const m=(w[1]-w[0])*.3;return[w[0]+m,w[1]-m];}
function drawGauge(win){$('arcRaw').setAttribute('d',arcPath(.02,win[0]));
$('arcGood').setAttribute('d',arcPath(win[0],win[1]));
const pw=perfectWin(win);
$('arcPerfect').setAttribute('d',arcPath(pw[0],pw[1]));
$('arcOver').setAttribute('d',arcPath(win[1],.98));}
function setNeedle(p){const[x,y]=needleAt(Math.max(0,Math.min(1,p)));
const n=$('needle');n.setAttribute('cx',x);n.setAttribute('cy',y);}

/* 익음 단계 크로스페이드 */
const ss=(a,b,x)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
function showStages(p,w0){
 stages.raw.style.opacity=1-ss(.30,.45,p);
 stages.mid.style.opacity=ss(.30,.45,p)*(1-ss(w0-.06,w0+.04,p));
 stages.gold.style.opacity=ss(w0-.06,w0+.04,p)*(1-ss(.84,.97,p));
 stages.burnt.style.opacity=ss(.84,.97,p);}
function forceStage(name){for(const k in stages)stages[k].style.opacity=k===name?1:0;}

/* ═══════════ 게임 상태 · 장사 단계 ═══════════ */
function loadBestScore(){try{const score=Number(localStorage.getItem('jf_best'));return Number.isFinite(score)?Math.max(0,Math.floor(score)):0;}catch(e){return 0;}}
function saveBestScore(score){try{localStorage.setItem('jf_best',String(score));}catch(e){}}
const RUSH_STAGES=[
 {id:'prep',label:'준비 영업',speed:1,window:1,score:1},
 {id:'busy',label:'손님 증가',speed:.88,window:.94,score:1},
 {id:'rush',label:'주문 폭주',speed:.78,window:.86,score:1},
 {id:'closing',label:'마감 러시',speed:.74,window:.82,score:1.5},
];
const G={playing:false,paused:false,pauseReason:'',pendingPauseAction:'',score:0,combo:0,best:0,count:0,timeLeft:60,
 jeon:null,selType:TYPES[0],lastTs:0,raf:0,timers:[],lastType:'',typeStreak:0,heatLvl:0,hiddenAt:0,
 stage:-1,lastSecond:60,perfectStreak:0,fever:false,feverLeft:0,highScore:loadBestScore()};
function armTimer(timer){
 timer.startedAt=performance.now();
 timer.id=setTimeout(()=>{
  timer.id=null;
  const index=G.timers.indexOf(timer);if(index>=0)G.timers.splice(index,1);
  timer.fn();
 },timer.remaining);
}
const later=(fn,ms)=>{const timer={fn,remaining:ms,startedAt:0,id:null};G.timers.push(timer);armTimer(timer);return timer;};
const clearTimers=()=>{G.timers.forEach(timer=>{if(timer.id!==null)clearTimeout(timer.id);});G.timers.length=0;};
const pauseTimers=()=>{const now=performance.now();G.timers.forEach(timer=>{
 if(timer.id===null)return;clearTimeout(timer.id);timer.id=null;
 timer.remaining=Math.max(0,timer.remaining-(now-timer.startedAt));});};
const resumeTimers=()=>{G.timers.forEach(timer=>{if(timer.id===null)armTimer(timer);});};
function updateBestScore(){bestScoreEl.textContent='최고 점수 '+G.highScore.toLocaleString('ko-KR');}
function stageForTime(time){return time<=10?3:time<=20?2:time<=40?1:0;}
function scaledWindow(win){const scale=RUSH_STAGES[Math.max(0,G.stage)].window;
 const mid=(win[0]+win[1])/2,half=(win[1]-win[0])*scale/2;return[mid-half,mid+half];}
function currentWindow(j=G.jeon){if(!j)return TYPES[0].win;return scaledWindow(j.side===1?j.type.win:j.type.win2);}
function comboMultiplier(){return G.combo>=6?2:G.combo>=4?1.5:G.combo>=2?1.2:1;}
function scoreMultiplier(){return comboMultiplier()*RUSH_STAGES[Math.max(0,G.stage)].score*(G.fever?2:1);}
function updateStatus(){
 const stage=RUSH_STAGES[Math.max(0,G.stage)];rushBadge.textContent=stage.label;
 perfectPips.forEach((pip,i)=>pip.classList.toggle('on',i<G.perfectStreak));
 statusStrip.classList.toggle('fever',G.fever);app.classList.toggle('feverMode',G.fever);
 trackLabel.textContent=G.fever?`피버 ${Math.max(0,G.feverLeft).toFixed(1)}초`:'황금';
 scoreMulti.textContent='x'+Number(scoreMultiplier().toFixed(1));
}
updateBestScore();updateStatus();

/* 이미지 프리로드 (전 교체 시 깜빡임 방지) */
const PRE=TYPES.flatMap(t=>['raw','mid','gold','burnt'].map(s=>`assets/${t.id}-${s}.webp`))
 .concat(Object.values(IMG),'assets/jeon-stack.webp');
addEventListener('load',()=>PRE.forEach(s=>{const i=new Image();i.src=s;}));

const BUB={
 start:'노릇노릇해지면 눌러요!',
 wait:['조금만 더~','아직이에요~','기다려요~'],
 flip:['홱~ 잘 뒤집었어요!','뒤집기 성공!','손놀림이 좋네요~'],
 pflip:['찰지게 뒤집었어요!!','와~ 예술이에요!'],
 side2:['뒷면도 노릇하게~','뒷면은 금방 익어요!'],
 done:['노릇노릇 완성!','맛있겠어요~','잘 부쳤어요!'],
 pdone:['완벽한 전이에요!!','손님이 감동하겠어요!'],
 early:['어이구, 덜 익었어요','조금 일렀어요~'],
 burnt:['아이고 탔어요 ㅠㅠ','타버렸네…','아까워라…']};
const pick=a=>a[Math.floor(Math.random()*a.length)];

let faceT=0;
function say(txt,face){bubble.textContent=txt;bubble.classList.remove('pop');void bubble.offsetWidth;
bubble.classList.add('pop');
if(face){ajImg.src=IMG[face];clearTimeout(faceT);
 faceT=setTimeout(()=>ajImg.src=IMG.happy,1600);}}

function toast(txt,cls){toastEl.textContent=txt;toastEl.className='';
void toastEl.offsetWidth;toastEl.className='show '+(cls||'');}
function popScore(n){scorePop.textContent='+'+n;scorePop.className='';
void scorePop.offsetWidth;scorePop.className='show';}
function flash(cls){flashEl.className='';void flashEl.offsetWidth;flashEl.className=cls;}
function burst(n,gold){for(let i=0;i<n;i++){const d=document.createElement('div');
d.className='pt'+(gold?' g':'');const a=Math.random()*Math.PI*2,r=55+Math.random()*95;
d.style.setProperty('--dx',Math.cos(a)*r+'px');
d.style.setProperty('--dy',(Math.sin(a)*r-50)+'px');
panWrap.appendChild(d);setTimeout(()=>d.remove(),800);}}

function showCountdown(n){countdownBurst.textContent=n;countdownBurst.classList.remove('show');void countdownBurst.offsetWidth;
 countdownBurst.classList.add('show');}
function stopFever(){if(!G.fever)return;G.fever=false;G.feverLeft=0;G.perfectStreak=0;
 app.classList.remove('feverMode');statusStrip.classList.remove('fever');updateHeat();updateStatus();}
function startFever(){G.fever=true;G.feverLeft=5;G.perfectStreak=3;updateHeat();updateStatus();
 toast('🔥 피버 타임 5초! x2','good');say('지금 몰아쳐요! 점수 두 배!','happy');burst(22,true);Sfx.fever();Sfx.vibrate([50,35,80]);}
function registerJudgment(q){
 if(G.fever)return;
 if(q==='perfect'){G.perfectStreak=Math.min(3,G.perfectStreak+1);if(G.perfectStreak>=3)startFever();}
 else G.perfectStreak=0;
 updateStatus();
}
function updateRushStage(initial=false){const next=stageForTime(G.timeLeft);if(next===G.stage)return;
 G.stage=next;const stage=RUSH_STAGES[next];app.classList.toggle('finalRush',next===3);updateHeat();
 if(G.jeon&&!G.jeon.resolved)drawGauge(currentWindow());
 updateStatus();
 if(initial)return;
 const messages={busy:['손님이 몰려와요!','조금 더 빠르게 갑니다!'],rush:['주문 폭주!','타이밍 존이 좁아졌어요!'],closing:['마감 10초! 점수 x1.5','마지막까지 몰아쳐요!']};
 const [title,line]=messages[stage.id];toast(title,next===3?'bad':'good');say(line,next===3?'surprised':'happy');Sfx.ding();Sfx.vibrate(next===3?[60,35,60]:35);
}
function applyTimePenalty(kind){const penalty=kind==='early'?1:3;G.timeLeft=Math.max(0,G.timeLeft-penalty);
 vTime.textContent=Math.max(0,Math.ceil(G.timeLeft));updateRushStage();return penalty;}
function award(base){const points=Math.round(base*scoreMultiplier());G.score+=points;vScore.textContent=G.score;return points;}

/* 주문: 대표 메뉴 45% + 나머지 랜덤, 같은 전 3연속 방지 */
function pickType(){
 let t;
 if(G.typeStreak>=2){t=pick(TYPES.filter(x=>x.id!==G.lastType));}
 else if(Math.random()<.45){t=G.selType;}
 else{t=pick(TYPES.filter(x=>x.id!==G.selType.id));}
 G.typeStreak=t.id===G.lastType?G.typeStreak+1:1;G.lastType=t.id;return t;}

/* 불 세기: 완성할수록 빨리 익고 불꽃도 커짐 */
function updateHeat(){
 const h=Math.min(7,G.count*.35+Math.max(0,G.stage)*1.15+(G.fever?1.6:0));
 flameWrap.style.transform=`scale(${1+h*.045})`;
 flamesEl.style.animationDuration=(.5/(1+h*.16))+'s';
 const lvl=Math.floor(G.count/4);
 if(lvl>G.heatLvl){G.heatLvl=lvl;toast('불이 더 세졌어요!','bad');}}

/* ── 한 장 사이클 ── */
function nextJeon(){
 const type=pickType();
 const cookMs=type.cookMs*(1-Math.min(.18,G.count*.018));
 const j=G.jeon={type,phase:'oil',t0:performance.now(),lastCookTs:0,p:0,warned:false,side:1,cookMs};
 typeBadge.textContent='주문 · '+type.name;typeBadge.classList.add('on');
 for(const s in stages){stages[s].src=`assets/${type.id}-${s}.webp`;
  stages[s].style.opacity=0;stages[s].style.filter='';}
 jeonStack.className='';nowHint.classList.remove('on');
 jeonStack.querySelectorAll('.steam,.smoke').forEach(s=>s.classList.remove('on'));
 drawGauge(currentWindow(j));setNeedle(0);gaugeLbl.textContent='앞면 익는 중';
 updateHeat();
 Sfx.cookVol(.06);Sfx.ding();
 say(pick([type.name+' 주문이요~',type.name+' 하나 추가요~','주문 들어왔어요~ '+type.name+'!']));
 later(()=>{if(G.jeon===j&&j.phase==='oil'){j.phase='pour';j.t0=performance.now();
  Sfx.pourSizzle(.9,.5);jeonStack.classList.add('drop');
  stages.raw.style.opacity=1;}},650);}

/* 뒤집기 성공 → 뒷면 굽기로 진행 */
function resolveFlip(q){
 const j=G.jeon;if(!j||j.resolved||j.phase!=='cook')return;j.phase='flipping';
 nowHint.classList.remove('on');
 const pts=award(q==='perfect'?80:40);
 jeonStack.classList.remove('sizzle','fast');jeonStack.classList.add('flip3d');
 jeonStack.querySelectorAll('.steam,.smoke').forEach(s=>s.classList.remove('on'));
 panImg.classList.add('shake');later(()=>panImg.classList.remove('shake'),450);
 if(q==='perfect'){toast('찰진 뒤집기!','good');say(pick(BUB.pflip),'happy');
  burst(10,true);Sfx.perfect();}
 else{toast('뒤집기!','good');say(pick(BUB.flip),'happy');burst(6,false);}
 popScore(pts);flash('good');Sfx.flip();Sfx.vibrate(40);registerJudgment(q);
 later(()=>{if(G.jeon!==j)return;
  jeonStack.classList.remove('flip3d');
  j.side=2;j.phase='cook';j.t0=performance.now();j.lastCookTs=performance.now();j.p=0;j.warned=false;
  forceStage('gold');stages.gold.style.filter='';
  drawGauge(currentWindow(j));setNeedle(0);gaugeLbl.textContent='뒷면 익는 중';
  jeonStack.classList.add('sizzle');
  say(pick(BUB.side2));},520);}

/* 완성(뒷면 성공) → 접시로 서빙 */
function resolveDone(q){
 const j=G.jeon;if(!j||j.resolved)return;j.resolved=true;j.phase='done';
 nowHint.classList.remove('on');
 G.combo++;G.best=Math.max(G.best,G.combo);G.count++;updateStatus();
 const pts=award(q==='perfect'?160:100);
 jeonStack.classList.remove('sizzle','fast');jeonStack.classList.add('toPlate');
 jeonStack.querySelectorAll('.steam,.smoke').forEach(s=>s.classList.remove('on'));
 forceStage('gold');stages.gold.style.filter='';
 if(q==='perfect'){toast('완벽한 전!','good');say(pick(BUB.pdone),'happy');
  burst(14,true);Sfx.perfect();}
 else{toast(pick(['노릇노릇 완성!','잘 익었어요~']),'good');say(pick(BUB.done),'happy');
  burst(8,false);}
 if(G.combo>=2)statCombo.classList.add('hot');
 popScore(pts);flash('good');Sfx.flip();Sfx.good();Sfx.vibrate(50);Sfx.cookVol(.1);registerJudgment(q);
 plateEl.classList.add('on');plateCnt.textContent='x'+G.count;
 plateEl.classList.remove('bump');void plateEl.offsetWidth;plateEl.classList.add('bump');
 vCombo.textContent=G.combo;
 later(()=>{if(G.playing)nextJeon();},1150);}

/* 실패: 덜 익음 / 탐 */
function resolveFail(kind){
 const j=G.jeon;if(!j||j.resolved)return;j.resolved=true;j.phase='done';
 nowHint.classList.remove('on');
 G.combo=0;G.perfectStreak=0;stopFever();updateStatus();statCombo.classList.remove('hot');
 const penalty=applyTimePenalty(kind);
 panImg.classList.add('shake');later(()=>panImg.classList.remove('shake'),450);
 if(kind==='early'){
  jeonStack.classList.add('flipBad');
  if(j.side===1)forceStage('mid');else stages.gold.style.filter='brightness(.85)';
  toast((j.side===1?'덜 익었어요':'뒷면이 덜 익었어요')+` · -${penalty}초`,'bad');
  say('서두르면 시간이 더 줄어요!','surprised');
  flash('bad');Sfx.flip();Sfx.bad();Sfx.vibrate([60,40,60]);Sfx.cookVol(.03);
 }else{
  jeonStack.classList.add('burnShake');forceStage('burnt');
  toast(`타버렸어요 · -${penalty}초`,'bad');say('아이고, 3초나 손해예요!','worried');
  flash('bad');Sfx.bad();Sfx.vibrate([120,60,120]);Sfx.cookVol(.02);
 }
 vCombo.textContent=G.combo;
 later(()=>{if(G.playing)nextJeon();},1150);}

/* ── 탭 처리 ── */
function onTap(){
 if(!G.playing||G.paused)return;
 const j=G.jeon;if(!j||j.resolved||j.phase!=='cook')return;
 const p=j.p,w=currentWindow(j);
 if(p<w[0]*.7){ // 너무 이름 → 경고만
  if(!j.warned){j.warned=true;say(pick(BUB.wait),'surprised');toast('아직이에요~','bad');}
  return;}
 if(p<w[0]){resolveFail('early');return;}
 if(p<=w[1]){
  const pw=perfectWin(w),q=p>=pw[0]&&p<=pw[1]?'perfect':'good';
  if(j.side===1)resolveFlip(q);else resolveDone(q);
 }else resolveFail('burnt');}

/* ── 메인 루프 ── */
function frame(ts){
 if(!G.playing||G.paused)return;
 const dt=Math.min(100,ts-G.lastTs);G.lastTs=ts;
 G.timeLeft-=dt/1000;
 if(G.fever){G.feverLeft=Math.max(0,G.feverLeft-dt/1000);if(G.feverLeft<=0){stopFever();toast('피버 종료!','');}}
 const tl=Math.max(0,Math.ceil(G.timeLeft));
 vTime.textContent=tl;
 statTime.querySelector('.value').classList.toggle('low',tl<=10&&tl>0);
 updateRushStage();
 if(tl!==G.lastSecond){G.lastSecond=tl;
  if(tl<=10&&tl>0){Sfx.tick(tl<=3);if(tl<=3){showCountdown(tl);Sfx.vibrate(25);}}
 }
 updateStatus();
 if(G.timeLeft<=0){endGame('마감 완료');return;}
 const j=G.jeon;
 if(j&&!j.resolved){
  const el=ts-j.t0;
  if(j.phase==='pour'){
   j.p=0;if(el>=700){j.phase='cook';j.t0=ts;j.lastCookTs=ts;jeonStack.classList.add('sizzle');}
  }else if(j.phase==='cook'){
   const cookDt=j.lastCookTs?Math.min(100,ts-j.lastCookTs):0;j.lastCookTs=ts;
   const stage=RUSH_STAGES[Math.max(0,G.stage)];
   const duration=j.cookMs*(j.side===1?1:.55)*stage.speed*(G.fever?.85:1);
   j.p+=cookDt/duration;
   const p=j.p,w=currentWindow(j);
   if(j.side===1)showStages(p,w[0]);
   else stages.gold.style.filter=`brightness(${1-Math.min(.3,Math.max(0,p-.55)*.6)})`;
   setNeedle(p);
   // 김치전은 색 헷갈림 → 지금이야 힌트 표시 안함
   const inWin=p>=w[0]&&p<=w[1];
   nowHint.classList.toggle('on',inWin&&j.type.id!=='kimchi');
   jeonStack.classList.toggle('fast',inWin);
   jeonStack.querySelectorAll('.steam').forEach(s=>s.classList.toggle('on',p>w[0]*.75&&p<.93));
   jeonStack.querySelectorAll('.smoke').forEach(s=>s.classList.toggle('on',p>=.93));
   Sfx.cookVol(p<w[0]?.08+p*.1:p<=w[1]?.22:.3);
   if(p>=1){resolveFail('burnt');}
  }
 }
 G.raf=requestAnimationFrame(frame);}

/* ── 게임 시작·일시정지·끝 ── */
function resetRunUI(){
 vScore.textContent='0';vCombo.textContent='0';vTime.textContent='60';
 statCombo.classList.remove('hot');statTime.querySelector('.value').classList.remove('low');
 plateEl.classList.remove('on');plateCnt.textContent='x0';
 app.classList.remove('finalRush','feverMode');countdownBurst.classList.remove('show');
}
function startGame(){
 Sfx.ensure();clearTimers();cancelAnimationFrame(G.raf);
 Object.assign(G,{playing:true,paused:false,pauseReason:'',pendingPauseAction:'',score:0,combo:0,best:0,count:0,timeLeft:60,
  lastType:'',typeStreak:0,heatLvl:0,stage:-1,lastSecond:60,perfectStreak:0,fever:false,feverLeft:0});
 resetRunUI();updateRushStage(true);updateStatus();
 startOv.classList.add('hidden');pauseOv.classList.add('hidden');endOv.classList.add('hidden');app.inert=false;
 $('flipBtn').disabled=false;Sfx.cookStart();nextJeon();
 $('flipBtn').focus({preventScroll:true});G.lastTs=performance.now();G.raf=requestAnimationFrame(frame);}
function freezeGame(reason){
 if(!G.playing||G.paused)return false;
 G.paused=true;G.pauseReason=reason;G.hiddenAt=performance.now();
 cancelAnimationFrame(G.raf);pauseTimers();Sfx.cookVol(0);return true;
}
function resumeGame(){
 if(!G.playing||!G.paused)return;
 const shift=performance.now()-G.hiddenAt;if(G.jeon){G.jeon.t0+=shift;G.jeon.lastCookTs=performance.now();}
 G.lastTs=performance.now();G.paused=false;G.pauseReason='';resumeTimers();
 pauseOv.classList.add('hidden');app.inert=false;Sfx.cookVol(.08);
 $('flipBtn').focus({preventScroll:true});G.raf=requestAnimationFrame(frame);
}
function openPause(){
 if(!freezeGame('manual'))return;
 pauseSummary.textContent=`현재 ${G.score.toLocaleString('ko-KR')}점 · 완성 ${G.count}장 · ${Math.ceil(G.timeLeft)}초 남음`;
 pauseMenu.classList.remove('hidden');pauseConfirm.classList.add('hidden');pauseOv.classList.remove('hidden');app.inert=true;
 $('resumeBtn').focus({preventScroll:true});
}
function showPauseConfirm(action,text){G.pendingPauseAction=action;$('pauseConfirmText').textContent=text;
 pauseMenu.classList.add('hidden');pauseConfirm.classList.remove('hidden');$('confirmNoBtn').focus({preventScroll:true});}
function closePauseConfirm(){G.pendingPauseAction='';pauseConfirm.classList.add('hidden');pauseMenu.classList.remove('hidden');
 $('resumeBtn').focus({preventScroll:true});}
function goHome(){
 G.playing=false;G.paused=false;G.pauseReason='';cancelAnimationFrame(G.raf);clearTimers();Sfx.cookStop();
 app.classList.remove('finalRush','feverMode');nowHint.classList.remove('on');typeBadge.classList.remove('on');
 pauseOv.classList.add('hidden');endOv.classList.add('hidden');startOv.classList.remove('hidden');app.inert=true;
 say(BUB.start);document.querySelector('.typeCard.sel').focus({preventScroll:true});
}
function runPauseAction(){const action=G.pendingPauseAction;G.pendingPauseAction='';
 if(action==='finish'){pauseOv.classList.add('hidden');endGame('직접 종료');}
 else if(action==='restart')startGame();
 else if(action==='home')goHome();
}
function endGame(reason='마감 완료'){
 G.playing=false;G.paused=false;G.pauseReason='';cancelAnimationFrame(G.raf);clearTimers();Sfx.cookStop();
 nowHint.classList.remove('on');typeBadge.classList.remove('on');app.classList.remove('finalRush','feverMode');
 pauseOv.classList.add('hidden');countdownBurst.classList.remove('show');$('endReason').textContent=reason;
 const isRecord=G.score>G.highScore;
 if(isRecord){G.highScore=G.score;saveBestScore(G.highScore);updateBestScore();}
 $('endJeon').textContent=G.count;$('endScore').textContent=G.score;
 $('endCombo').textContent='최고 콤보 x'+G.best;
 endBestEl.textContent=(isRecord?'신기록! · ':'')+'최고 점수 '+G.highScore.toLocaleString('ko-KR');
 endBestEl.classList.toggle('record',isRecord);
 const n=G.count>=8?3:G.count>=5?2:G.count>=2?1:0;
 const starsEl=$('stars');starsEl.setAttribute('aria-label',`별 ${n}개 / 3개`);
 starsEl.innerHTML=[1,2,3].map(i=>`<span aria-hidden="true" class="${i<=n?'':'off'}">★</span>`).join('');
 $('endMsg').textContent=n>=3?'와~ 전 장인이세요!':n===2?'맛있게 부쳤어요!':n===1?'조금 아쉬워요, 한 번 더!':G.count===1?'첫 장 완성! 이제 감 잡았어요!':reason==='직접 종료'?'현재 점수로 영업을 마쳤어요.':'앗, 전이 다 타버렸네요…';
 if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
 app.inert=true;$('flipBtn').disabled=true;endOv.classList.remove('hidden');$('retryBtn').focus({preventScroll:true});}

/* ── 이벤트 ── */
document.addEventListener('pointerdown',e=>{
 if(e.target.closest('.overlay,#flipBtn,#pauseBtn,#sfxBtn'))return;
 onTap();},{passive:true});
let flipHandledByPointer=false;
$('flipBtn').addEventListener('pointerdown',()=>{flipHandledByPointer=true;onTap();});
$('flipBtn').addEventListener('click',()=>{if(!flipHandledByPointer)onTap();flipHandledByPointer=false;});
$('flipBtn').addEventListener('pointerup',()=>setTimeout(()=>{flipHandledByPointer=false;},0));
$('flipBtn').addEventListener('pointercancel',()=>{flipHandledByPointer=false;});
$('startBtn').addEventListener('click',startGame);
$('retryBtn').addEventListener('click',startGame);
$('homeBtn').addEventListener('click',goHome);
pauseBtn.addEventListener('click',openPause);
$('resumeBtn').addEventListener('click',resumeGame);
$('finishBtn').addEventListener('click',()=>showPauseConfirm('finish','현재 점수로 영업을 종료할까요?'));
$('restartBtn').addEventListener('click',()=>showPauseConfirm('restart','점수와 콤보를 지우고 다시 시작할까요?'));
$('pauseHomeBtn').addEventListener('click',()=>showPauseConfirm('home','현재 게임을 포기하고 대표 메뉴 화면으로 갈까요?'));
$('confirmYesBtn').addEventListener('click',runPauseAction);
$('confirmNoBtn').addEventListener('click',closePauseConfirm);
function updateSfxButton(){const muted=Sfx.isMuted();sfxBtn.classList.toggle('muted',muted);
 sfxBtn.setAttribute('aria-pressed',String(!muted));
 sfxBtn.title=muted?'사운드 켜기':'사운드 끄기';}
updateSfxButton();
sfxBtn.addEventListener('click',()=>{Sfx.ensure();Sfx.setMuted(!Sfx.isMuted());updateSfxButton();});
document.querySelectorAll('.typeCard').forEach(c=>{
 c.addEventListener('click',()=>{
  document.querySelectorAll('.typeCard').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-pressed','false');});
  c.classList.add('sel');c.setAttribute('aria-pressed','true');
  G.selType=TYPES.find(t=>t.id===c.dataset.t);});});
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||!G.playing)return;
 e.preventDefault();if(G.paused&&G.pauseReason==='manual'){
  if(!pauseConfirm.classList.contains('hidden'))closePauseConfirm();else resumeGame();
 }else if(!G.paused)openPause();});
/* 백그라운드에서는 같은 정지 엔진을 사용하되 메뉴는 띄우지 않음 */
document.addEventListener('visibilitychange',()=>{
 if(!G.playing)return;
 if(document.hidden){if(!G.paused)freezeGame('hidden');}
 else if(G.paused&&G.pauseReason==='hidden')resumeGame();});
document.querySelector('.typeCard.sel').focus({preventScroll:true});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
