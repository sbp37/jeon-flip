<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>전 뒤집기</title>
<meta name="description" content="노릇노릇할 때 탭! 60초 안에 전을 최대한 많이 뒤집는 1탭 타이밍 미니게임">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f8f1e4; --paper:#fdf6e9; --brown:#6b4a2f; --brown-d:#4a3018;
  --orange:#f08a2d; --orange-d:#d96f1a; --green:#7cb342; --red:#e05b3a;
  --jeon-green:#8fbf5f; --jeon-red:#e0694a; --jeon-blue:#5b9bc7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#e8d5b4 url('assets/bg-scene.webp') center/cover no-repeat fixed;
  font-family:'Jua','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
  color:var(--brown-d); user-select:none; -webkit-user-select:none;
  touch-action:manipulation; overflow:hidden;
}
#app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* ── HUD ─────────────────────────────── */
#hud{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 4px;z-index:5}
.iconBtn{width:46px;height:46px;border-radius:50%;border:3px solid #c9a875;background:var(--paper);
  font-size:19px;cursor:pointer;box-shadow:0 3px 0 #b8946a;font-family:inherit;line-height:1;flex:none}
.iconBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8946a}
#scoreBox{flex:1;text-align:center;line-height:1}
#scoreBox .lbl{display:block;font-size:15px;color:#7a5c3a}
#vScore{font-size:44px;color:#5b3a1e;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.hudRight{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;min-width:96px}
.chip{background:var(--paper);border:3px solid #c9a875;border-radius:999px;padding:2px 12px;
  font-size:15px;color:#5b3a1e;box-shadow:0 2px 0 #b8946a;white-space:nowrap}
#comboChip b{color:var(--orange)}
#comboChip.hot{animation:pulse .4s infinite}
#timeChip.low{color:var(--red);animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

/* ── 팬 + 게이지 ─────────────────────── */
#playArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 16px}
#panWrap{position:relative;width:min(62vw,290px);aspect-ratio:887/1203;flex:none}
#gaugeWrap{width:min(70vw,300px);margin-bottom:-16px;z-index:4;pointer-events:none}
#gauge{width:100%;display:block;filter:drop-shadow(0 2px 2px rgba(60,35,10,.35))}
#gauge text{font-size:14px;font-family:'Jua';fill:#7a5c3a}
#typeBadge{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;
  font-size:16px;padding:3px 15px;border-radius:999px;z-index:5;box-shadow:0 3px 0 rgba(0,0,0,.2);
  opacity:0;transition:opacity .2s;white-space:nowrap}
#typeBadge.on{opacity:1}
#nowHint{position:absolute;top:-34px;left:50%;transform:translateX(-50%) scale(0);
  background:#ffd54a;color:#5b3a1e;font-size:20px;padding:4px 18px;border-radius:999px;
  box-shadow:0 3px 0 #d8a312;transition:transform .15s;z-index:6;white-space:nowrap}
#nowHint.on{transform:translateX(-50%) scale(1);animation:nowPulse .4s infinite}
@keyframes nowPulse{50%{transform:translateX(-50%) scale(1.1)}}
#flameWrap{position:absolute;left:-14%;right:-14%;top:-11%;bottom:24%;z-index:0;transform-origin:50% 50%;transition:transform .6s}
#flames{width:100%;height:100%;object-fit:contain;pointer-events:none;
  animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.85;transform:scale(1)}100%{opacity:1;transform:scale(1.03)}}
#jeonStack{position:absolute;inset:0;transform-origin:center;transform-style:preserve-3d;z-index:2}
#jeonStack.drop{animation:jeonDrop .55s ease-out}
@keyframes jeonDrop{0%{transform:scale(.25);opacity:.4}60%{transform:scale(1.05)}100%{transform:scale(1)}}
#jeonStack.sizzle{animation:sizzleWob .5s ease-in-out infinite}
#jeonStack.sizzle.fast{animation-duration:.26s}
@keyframes sizzleWob{0%,100%{transform:scale(1) rotate(0deg)}30%{transform:scale(1.012) rotate(.5deg)}70%{transform:scale(.998) rotate(-.4deg)}}
#jeonStack.flip3d{animation:flip3d .52s ease-in-out}
@keyframes flip3d{0%{transform:rotateX(0)}35%{transform:rotateX(200deg) translateY(-26%) scale(1.08)}100%{transform:rotateX(360deg)}}
#jeonStack.flipBad{animation:flipBad .5s ease-out}
@keyframes flipBad{30%{transform:translateY(-6%) scale(.98)}100%{transform:translateY(0) scale(1)}}
#jeonStack.burnShake{animation:burnShake .5s ease-in-out}
@keyframes burnShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#jeonStack.toPlate{animation:toPlate .6s ease-in forwards}
@keyframes toPlate{20%{transform:translateY(-9%) scale(1.03)}100%{transform:translate(52%,55%) scale(.22);opacity:0}}
#panWrap{perspective:700px}
.jstage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;
  filter:drop-shadow(0 14px 14px rgba(80,50,20,.35))}
.steam{position:absolute;width:16px;height:26px;border-radius:50%;z-index:3;
  background:radial-gradient(ellipse,rgba(255,255,255,.8),transparent 70%);
  opacity:0;pointer-events:none}
.steam.s1{left:38%;top:18%}.steam.s2{left:56%;top:22%}.steam.s3{left:47%;top:10%}
.steam.on{animation:steamUp 1.4s ease-out infinite}
.steam.on.s2{animation-delay:.45s}.steam.on.s3{animation-delay:.9s}
@keyframes steamUp{0%{opacity:0;transform:translateY(0) scale(.7)}25%{opacity:.9}100%{opacity:0;transform:translateY(-70px) scale(1.5)}}
.smoke{position:absolute;width:30px;height:40px;border-radius:50%;left:45%;top:12%;z-index:3;
  background:radial-gradient(ellipse,rgba(70,65,60,.75),transparent 70%);opacity:0;pointer-events:none}
.smoke.on{animation:steamUp 1.1s ease-out infinite}
#subLbl{font-size:19px;color:#6b4a2f;margin-top:10px;text-shadow:0 1px 0 rgba(255,255,255,.4)}

/* 완성 접시 */
#plate{position:absolute;right:-7%;bottom:-4%;width:36%;opacity:0;transition:opacity .3s;z-index:3;pointer-events:none}
#plate.on{opacity:1}
#plate img{width:100%;display:block;filter:drop-shadow(0 6px 8px rgba(80,50,20,.35))}
#plate.bump img{animation:plateBump .4s}
@keyframes plateBump{40%{transform:scale(1.12)}}
#plateCnt{position:absolute;right:2%;top:-6px;background:var(--orange);color:#fff;font-size:15px;
  padding:1px 10px;border-radius:999px;box-shadow:0 2px 0 #c55f0e}

/* 결과 토스트 */
#toast{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:36px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);
  z-index:7;white-space:nowrap;pointer-events:none}
#toast.show{animation:toastPop 1s ease-out forwards}
@keyframes toastPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
#toast.good{color:#ffe28a}
#toast.bad{color:#efe6d8}
#scorePop{position:absolute;top:26%;left:50%;transform:translateX(-50%);font-size:28px;color:#5da02c;opacity:0;pointer-events:none;z-index:7;text-shadow:0 2px 0 #fff}
#scorePop.show{animation:scoreUp .9s ease-out forwards}
@keyframes scoreUp{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
#flash.good{background:radial-gradient(circle,rgba(255,190,60,.28),transparent 70%);animation:flashA .45s ease-out}
#flash.bad{background:radial-gradient(circle,rgba(60,50,40,.3),transparent 70%);animation:flashA .45s ease-out}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}

/* 파티클 */
.pt{position:absolute;left:50%;top:44%;width:11px;height:11px;margin:-5px;border-radius:50%;z-index:6;
  background:radial-gradient(circle,#ffe9a0,#f0a02d);pointer-events:none;
  animation:ptFly .75s ease-out forwards}
.pt.g{background:radial-gradient(circle,#fff,#ffd76a);box-shadow:0 0 9px #ffd76a;width:13px;height:13px}
@keyframes ptFly{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}

/* ── 탭! 버튼 ────────────────────────── */
#flipBtn{display:block;width:min(38vw,140px);aspect-ratio:1;margin:4px auto 8px;border:6px solid #b85a10;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#f8a94f,var(--orange) 60%,#e0700f);
  color:#fff;font-family:inherit;font-size:42px;letter-spacing:2px;line-height:1;
  text-shadow:0 3px 0 rgba(120,55,0,.6);cursor:pointer;
  box-shadow:0 7px 0 #9c4d0c,0 10px 14px rgba(120,60,10,.4)}
#flipBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c4d0c,0 3px 6px rgba(120,60,10,.4)}
#flipBtn .sub{display:block;font-size:13px;opacity:.95;margin-top:4px;letter-spacing:0}
#flipBtn:disabled{filter:grayscale(.5) brightness(.92)}

/* ── 하단 아주머니 + 말풍선 ────────────── */
#ajRow{display:flex;align-items:center;gap:10px;padding:0 16px 10px;min-height:64px}
#ajImg{width:56px;height:56px;border-radius:50%;border:3px solid #c9a875;background:var(--paper);
  object-fit:cover;object-position:top;flex:none;box-shadow:0 3px 0 #b8946a}
#bubble{position:relative;background:#fffdf6;border:3px solid #c9a875;border-radius:18px;
  padding:6px 14px;font-size:18px;color:#5b3a1e;line-height:1.3;max-width:80%}
#bubble::before{content:'';position:absolute;left:-10px;top:16px;width:14px;height:14px;
  background:#fffdf6;border-left:3px solid #c9a875;border-bottom:3px solid #c9a875;transform:rotate(45deg)}
#bubble.pop{animation:bubblePop .25s ease-out}
@keyframes bubblePop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* 사운드 토글 */
#sfxBtn{position:absolute;top:76px;right:14px;z-index:9}

/* ── 시작 화면 ───────────────────────── */
#startOv{align-items:stretch;padding:0;background:#e8d5b4 url('assets/bg-scene.webp') center/cover no-repeat}
#startCard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:20px 22px;text-align:center;position:relative;max-width:480px;margin:0 auto;width:100%}
#ajHero{position:relative;width:min(52vw,210px);margin-bottom:-6px;margin-left:-34%}
#ajHero img{width:100%;display:block;filter:drop-shadow(0 8px 10px rgba(80,50,20,.3))}
#heroBubble{position:absolute;top:-8%;left:88%;width:140%;background:#fffdf6;border:3px solid #c9a875;
  border-radius:18px;padding:7px 14px;font-size:18px;color:#5b3a1e;line-height:1.35;text-align:left;
  box-shadow:0 4px 0 #b8946a}
#heroBubble::before{content:'';position:absolute;left:-10px;top:50%;width:14px;height:14px;
  background:#fffdf6;border-left:3px solid #c9a875;border-bottom:3px solid #c9a875;transform:rotate(45deg) translateY(-50%)}
#titleImg{width:min(72%,300px);display:block;margin:0 auto}
#startSub{font-size:19px;color:#7a5c3a;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.selRow{display:flex;gap:10px;justify-content:center;margin:14px 0 12px;width:100%}
.typeCard{flex:1;max-width:120px;border:4px solid rgba(0,0,0,.15);border-radius:18px;padding:10px 6px 11px;
  cursor:pointer;text-align:center;transition:transform .12s,border-color .12s;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.18)}
.typeCard img{width:100%;aspect-ratio:1;object-fit:contain}
.typeCard .tn{font-size:19px;margin-top:2px;line-height:1.2;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.typeCard .tt{font-size:12px;line-height:1.3;margin-top:2px;font-family:'Pretendard','Noto Sans KR',sans-serif;
  font-weight:600;opacity:.92;word-break:keep-all}
.typeCard[data-t="buchu"]{background:var(--jeon-green)}
.typeCard[data-t="kimchi"]{background:var(--jeon-red)}
.typeCard[data-t="haemul"]{background:var(--jeon-blue)}
.typeCard.sel{border-color:#fff;transform:translateY(-5px);box-shadow:0 8px 0 rgba(0,0,0,.22)}
.prop{position:absolute;pointer-events:none;filter:drop-shadow(0 4px 5px rgba(80,50,20,.3))}
#propCat{right:1%;bottom:1%;width:17%}
#propOil{left:2%;bottom:2%;width:11%}

/* ── 오버레이 카드 공통 ────────────────── */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(60,40,20,.45);padding:20px}
.overlay.hidden{display:none}
.card{width:100%;max-width:400px;background:var(--paper);border:3px solid #c9a875;border-radius:26px;
  padding:24px 22px;text-align:center;box-shadow:0 16px 40px rgba(60,40,10,.4)}
.bigBtn{display:block;width:100%;height:86px;margin-top:10px;border:none;border-radius:20px;
  color:#fff;font-family:inherit;font-size:32px;letter-spacing:1px;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.bigBtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.bigBtn.yellow{background:linear-gradient(#ffd54a,#f2a91f);color:#5b3a1e;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.bigBtn.green{background:linear-gradient(#8bc34a,#67a02c);color:#fff}
.bigBtn.orange{background:linear-gradient(#f08a2d,#e0700f);color:#fff}

/* ── 결과 화면 ───────────────────────── */
#endCard{position:relative}
#endTitle{font-size:36px;line-height:1.15}
#endTitle span{color:var(--orange)}
#endSub{font-size:18px;color:#8a6a45;margin-top:2px}
#stars{font-size:38px;letter-spacing:6px;margin:6px 0 2px;color:#e8a52a}
#stars .off{opacity:.25}
#endStack{width:170px;margin:0 auto;display:block}
#endQuote{font-size:16px;color:#8a6a45;background:#f3e6cc;border-radius:12px;padding:5px 12px;
  display:inline-block;margin-top:4px}
#endScore{font-size:52px;color:var(--orange);line-height:1.1;margin-top:4px}
#endCount{font-size:17px;color:#5b3a1e}
#endCombo{font-size:15px;color:#8a6a45;margin-top:2px}
#homeBtn{display:block;margin:10px auto 0;background:none;border:none;color:#8a6a45;font-size:17px;
  font-family:inherit;cursor:pointer}
.hintLine{font-size:15px;color:#a08464;margin-top:12px;line-height:1.6;
  font-family:'Pretendard','Noto Sans KR',sans-serif;font-weight:600}

/* ── 일시정지 ────────────────────────── */
#pauseOv .card{padding:34px 22px}
#pauseOv .card h1{font-size:34px}

@media (max-height: 720px){
  #hud{padding:8px 12px 2px}
  #vScore{font-size:34px}
  .iconBtn{width:40px;height:40px;font-size:16px}
  #gaugeWrap{width:min(56vw,240px,20dvh)}
  #panWrap{width:min(54vw,240px,34dvh)}
  #flipBtn{width:min(30vw,110px);font-size:34px;margin-bottom:6px}
  #ajRow{min-height:50px;padding-bottom:8px}
  #ajImg{width:44px;height:44px}
  #bubble{font-size:15px;padding:4px 12px}
  #subLbl{font-size:16px;margin-top:6px}
  #ajHero{width:min(34vw,140px)}
  #heroBubble{font-size:14px;width:140%}
  #titleImg{width:min(60%,240px)}
  .typeCard{max-width:100px;padding:8px 4px 9px}
  .bigBtn{height:70px;font-size:26px}
  #endScore{font-size:40px}
  #stars{font-size:30px}
  #endStack{width:130px}
  .card{max-height:94dvh;overflow:auto;padding:18px 16px}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <button class="iconBtn" id="pauseBtn" type="button" aria-label="일시정지">⏸</button>
    <div id="scoreBox"><span class="lbl">점수</span><span id="vScore">0</span></div>
    <div class="hudRight">
      <span class="chip" id="comboChip" style="display:none">연속 🔥<b id="vCombo">0</b>콤보!</span>
      <span class="chip" id="timeChip">⏱ <b id="vTime">60</b></span>
    </div>
  </header>

  <div id="playArea">
    <div id="gaugeWrap">
      <svg id="gauge" viewBox="0 0 200 136" aria-hidden="true">
          <path id="arcRaw"   fill="none" stroke="#f3e3bd" stroke-width="16" stroke-linecap="round"/>
          <path id="arcGood"  fill="none" stroke="#7cb342" stroke-width="16" stroke-linecap="round"/>
          <path id="arcPerfect" fill="none" stroke="#ffd54a" stroke-width="16" stroke-linecap="round"/>
          <path id="arcOver"  fill="none" stroke="#e05b3a" stroke-width="16" stroke-linecap="round"/>
          <circle id="needle" r="8" fill="#fffdf6" stroke="#5b3a1e" stroke-width="3.5"/>
        </svg>
      </div>
    <div id="panWrap">
      <div id="typeBadge"></div>
      <div id="nowHint">지금이야!</div>
      <div id="flameWrap"><img id="flames" src="assets/flames.webp" alt=""></div>
      <div id="jeonStack">
        <img class="jstage" id="jOil" alt="">
        <img class="jstage" id="jBatter" alt="">
        <img class="jstage" id="jMid" alt="">
        <img class="jstage" id="jGold" alt="">
        <img class="jstage" id="jFlipped" alt="">
        <img class="jstage" id="jBurnt" alt="">
        <div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div>
        <div class="smoke sm1"></div>
      </div>
      <div id="plate"><img src="assets/jeon-stack.webp" alt="완성된 전"><span id="plateCnt">x0</span></div>
    </div>
    <div id="subLbl">노릇할 때 탭!</div>
    <div id="toast"></div>
    <div id="scorePop"></div>
  </div>

  <button id="flipBtn" type="button">탭!<span class="sub">뒤집기</span></button>

  <div id="ajRow">
    <img id="ajImg" src="assets/ajumma-smile.webp" alt="전집 아주머니">
    <div id="bubble">노릇노릇해지면 눌러요!</div>
  </div>
  <button id="sfxBtn" class="iconBtn" type="button" aria-label="사운드 켜기/끄기">🔊</button>
</div>
<div id="flash"></div>

<div class="overlay" id="startOv">
  <div id="startCard">
    <div id="ajHero">
      <div id="heroBubble">오늘은 어떤 전을<br>부칠까요?</div>
      <img src="assets/ajumma-body.webp" alt="전집 아주머니">
    </div>
    <img id="titleImg" src="assets/title.png" alt="전 뒤집기">
    <p id="startSub">지글지글, 맛있는 전 한 판!</p>
    <div class="selRow" id="selRow">
      <div class="typeCard sel" data-t="buchu"><img src="assets/buchu-gold.webp" alt=""><div class="tn">부추전</div><div class="tt">보통 속도<br>넉넉한 타이밍</div></div>
      <div class="typeCard" data-t="kimchi"><img src="assets/kimchi-gold.webp" alt=""><div class="tn">김치전</div><div class="tt">색이 진해<br>살짝 헷갈림</div></div>
      <div class="typeCard" data-t="haemul"><img src="assets/haemul-gold.webp" alt=""><div class="tn">해물전</div><div class="tt">천천히 익고<br>타이밍 짧음</div></div>
    </div>
    <button class="bigBtn yellow" id="startBtn" type="button" style="max-width:340px">시작하기 &gt;</button>
    <img class="prop" id="propOil" src="assets/prop-oilbottle.webp" alt="">
    <img class="prop" id="propCat" src="assets/prop-cat.webp" alt="">
  </div>
</div>

<div class="overlay hidden" id="endOv">
  <div class="card" id="endCard">
    <h1 id="endTitle">오늘 전 <span id="endJeon">0</span>장!</h1>
    <div id="endSub"></div>
    <div id="stars"></div>
    <img id="endStack" src="assets/jeon-stack.webp" alt="">
    <div id="endQuote"></div>
    <div id="endScore">0</div>
    <div id="endCount">점수</div>
    <div id="endCombo"></div>
    <button class="bigBtn green" id="retryBtn" type="button">↺ 다시 하기</button>
    <button class="bigBtn orange" id="otherBtn" type="button">다른 전 도전하기 &gt;</button>
    <button id="homeBtn" type="button">🏠 처음으로</button>
  </div>
</div>

<div class="overlay hidden" id="pauseOv">
  <div class="card">
    <h1>일시정지</h1>
    <button class="bigBtn green" id="resumeBtn" type="button">계속하기</button>
    <button id="homeBtn2" type="button" style="display:block;margin:10px auto 0;background:none;border:none;color:#8a6a45;font-size:17px;font-family:inherit;cursor:pointer">🏠 처음으로</button>
  </div>
</div>

<script>
'use strict';
/* ═══════════ 사운드 (WebAudio 합성) ═══════════ */
const Sfx=(()=>{let ctx=null,master=null,crackleBuf=null,cookGain=null,cookSrc=null;
let muted=false;
try{muted=localStorage.getItem('jf_mute')==='1';}catch(e){}
function ensure(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
master=ctx.createGain();master.gain.value=muted?0:.9;master.connect(ctx.destination);}
if(ctx.state==='suspended')ctx.resume();}
function isMuted(){return muted;}
function setMuted(m){muted=m;try{localStorage.setItem('jf_mute',m?'1':'0');}catch(e){}
if(master)master.gain.value=m?0:.9;}
function noiseBuf(dur){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
// 지글지글 루프용 버퍼: 잡음 + 랜덤 튀는 팝
function crackle(dur){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
let e=0;for(let i=0;i<n;i++){if(Math.random()<.0035)e=1;e*=.994;
d[i]=(Math.random()*2-1)*(.06+e*.55);}return b;}
function pop(t,vol,f){const s=ctx.createBufferSource();s.buffer=noiseBuf(.03);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);}
// 반죽 부을 때 "치익~"
function pourSizzle(dur=.9,vol=.55){if(!ctx)return;const t=ctx.currentTime;
const s=ctx.createBufferSource();s.buffer=noiseBuf(dur);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(5200,t);
bp.frequency.exponentialRampToValueAtTime(3400,t+dur);bp.Q.value=.8;
const g=ctx.createGain();g.gain.setValueAtTime(.001,t);
g.gain.exponentialRampToValueAtTime(vol,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+dur);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
const pops=Math.floor(dur*40);for(let i=0;i<pops;i++)pop(t+Math.random()*dur,vol*(.3+Math.random()*.7),3000+Math.random()*5000);
const ls=ctx.createBufferSource();ls.buffer=noiseBuf(dur*.7);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
const lg=ctx.createGain();lg.gain.setValueAtTime(.001,t);lg.gain.exponentialRampToValueAtTime(vol*.35,t+.08);
lg.gain.exponentialRampToValueAtTime(.001,t+dur*.7);
ls.connect(lp);lp.connect(lg);lg.connect(master);ls.start(t);}
// 익는 동안 잔잔한 지글거림 루프
function cookStart(){if(!ctx)return;cookStop();
crackleBuf=crackleBuf||crackle(2.5);
cookSrc=ctx.createBufferSource();cookSrc.buffer=crackleBuf;cookSrc.loop=true;
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4200;bp.Q.value=.7;
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;
cookGain=ctx.createGain();cookGain.gain.value=0;
cookSrc.connect(bp);bp.connect(lp);lp.connect(cookGain);cookGain.connect(master);cookSrc.start();}
function cookVol(v){if(cookGain&&ctx)cookGain.gain.setTargetAtTime(v,ctx.currentTime,.1);}
function cookStop(){if(cookSrc){try{cookSrc.stop();}catch(e){}cookSrc=null;cookGain=null;}}
// 뒤집기: 휙 + 팬에 착
function flip(){if(!ctx)return;const t=ctx.currentTime;
const s=ctx.createBufferSource();s.buffer=noiseBuf(.12);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(1600,t);
bp.frequency.exponentialRampToValueAtTime(500,t+.12);bp.Q.value=1.5;
const g=ctx.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(200,t+.05);
o.frequency.exponentialRampToValueAtTime(70,t+.17);
const og=ctx.createGain();og.gain.setValueAtTime(.5,t+.05);og.gain.exponentialRampToValueAtTime(.001,t+.19);
o.connect(og);og.connect(master);o.start(t+.05);o.stop(t+.2);
pop(t+.06,.5,1400);}
function good(){if(!ctx)return;const t=ctx.currentTime;[660,880].forEach((f,i)=>{
const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
const g=ctx.createGain();const st=t+.07*i;g.gain.setValueAtTime(.001,st);
g.gain.exponentialRampToValueAtTime(.28,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.25);
o.connect(g);g.connect(master);o.start(st);o.stop(st+.3);});}
function bad(){if(!ctx)return;const t=ctx.currentTime;
const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(180,t);
o.frequency.exponentialRampToValueAtTime(80,t+.35);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;
const g=ctx.createGain();g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+.42);}
// 완벽 판정: 반짝이는 아르페지오
function perfect(){if(!ctx)return;const t=ctx.currentTime;[880,1108.7,1318.5].forEach((f,i)=>{
const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
const g=ctx.createGain();const st=t+.06*i;g.gain.setValueAtTime(.001,st);
g.gain.exponentialRampToValueAtTime(.24,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.3);
o.connect(g);g.connect(master);o.start(st);o.stop(st+.34);});}
// 주문 들어올 때 딩동
function ding(){if(!ctx)return;const t=ctx.currentTime;
const g=ctx.createGain();g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
[1568,2093].forEach(f=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;
o.connect(g);o.start(t);o.stop(t+.42);});
g.connect(master);}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
return{ensure,isMuted,setMuted,pourSizzle,cookStart,cookVol,cookStop,flip,good,bad,perfect,ding,vibrate};})();

/* ═══════════ 전 종류 ═══════════ */
const TYPES=[
 {id:'buchu',name:'부추전',cookMs:4200,win:[.60,.82],win2:[.55,.80]},
 {id:'kimchi',name:'김치전',cookMs:3800,win:[.64,.78],win2:[.58,.78]},
 {id:'haemul',name:'해물전',cookMs:5200,win:[.70,.83],win2:[.62,.82]},
];

const $=id=>document.getElementById(id);
const vScore=$('vScore'),vTime=$('vTime'),vCombo=$('vCombo'),timeChip=$('timeChip'),comboChip=$('comboChip');
const bubble=$('bubble'),ajImg=$('ajImg'),typeBadge=$('typeBadge');
const jeonStack=$('jeonStack'),panWrap=$('panWrap'),nowHint=$('nowHint'),subLbl=$('subLbl');
const stages={oil:$('jOil'),batter:$('jBatter'),mid:$('jMid'),gold:$('jGold'),flipped:$('jFlipped'),burnt:$('jBurnt')};
const toastEl=$('toast'),scorePop=$('scorePop'),flashEl=$('flash');
const startOv=$('startOv'),endOv=$('endOv'),pauseOv=$('pauseOv');
const flamesEl=$('flames'),flameWrap=$('flameWrap');
const plateEl=$('plate'),plateCnt=$('plateCnt'),sfxBtn=$('sfxBtn');

const IMG={smile:'assets/ajumma-smile.webp',laugh:'assets/ajumma-laugh.webp',proud:'assets/ajumma-proud.webp',
surprised:'assets/ajumma-surprised.webp',worried:'assets/ajumma-worried.webp',expect:'assets/ajumma-expect.webp'};

/* 게이지 arc (팬 위에 걸치는 호) */
const GA={cx:100,cy:100,r:72,a0:155,a1:385}; // deg, 상단을 크게 도는 호
function arcPath(t0,t1){const rad=d=>d*Math.PI/180;
const x0=GA.cx+GA.r*Math.cos(rad(GA.a0+(GA.a1-GA.a0)*t0));
const y0=GA.cy+GA.r*Math.sin(rad(GA.a0+(GA.a1-GA.a0)*t0));
const x1=GA.cx+GA.r*Math.cos(rad(GA.a0+(GA.a1-GA.a0)*t1));
const y1=GA.cy+GA.r*Math.sin(rad(GA.a0+(GA.a1-GA.a0)*t1));
const laf=(t1-t0)*(GA.a1-GA.a0)>180?1:0;return`M ${x0} ${y0} A ${GA.r} ${GA.r} 0 ${laf} 1 ${x1} ${y1}`;}
function needleAt(p){const rad=d=>d*Math.PI/180,a=GA.a0+(GA.a1-GA.a0)*p;
return[GA.cx+GA.r*Math.cos(rad(a)),GA.cy+GA.r*Math.sin(rad(a))];}
function perfectWin(w){const m=(w[1]-w[0])*.3;return[w[0]+m,w[1]-m];}
function drawGauge(win){$('arcRaw').setAttribute('d',arcPath(.02,win[0]));
$('arcGood').setAttribute('d',arcPath(win[0],win[1]));
const pw=perfectWin(win);
$('arcPerfect').setAttribute('d',arcPath(pw[0],pw[1]));
$('arcOver').setAttribute('d',arcPath(win[1],.98));}
function setNeedle(p){const[x,y]=needleAt(Math.max(0,Math.min(1,p)));
const n=$('needle');n.setAttribute('cx',x);n.setAttribute('cy',y);}

/* 익음 단계 크로스페이드 (앞면: 반죽→덜익음→노릇→탐) */
const ss=(a,b,x)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
function showStages(p,w0){
 stages.oil.style.opacity=0;
 stages.batter.style.opacity=1-ss(.30,.45,p);
 stages.mid.style.opacity=ss(.30,.45,p)*(1-ss(w0-.06,w0+.04,p));
 stages.gold.style.opacity=ss(w0-.06,w0+.04,p)*(1-ss(.84,.97,p));
 stages.flipped.style.opacity=0;
 stages.burnt.style.opacity=ss(.84,.97,p);}
function forceStage(name){for(const k in stages)stages[k].style.opacity=k===name?1:0;}

/* ═══════════ 게임 상태 ═══════════ */
const G={playing:false,paused:false,score:0,combo:0,best:0,count:0,timeLeft:60,
 jeon:null,selType:TYPES[0],lastTs:0,raf:0,timers:[],lastType:'',typeStreak:0,heatLvl:0,hiddenAt:0};
const later=(fn,ms)=>{const id=setTimeout(fn,ms);G.timers.push(id);return id;};
const clearTimers=()=>{G.timers.forEach(clearTimeout);G.timers.length=0;};

/* 이미지 프리로드 (전 교체 시 깜빡임 방지) */
const PRE=TYPES.flatMap(t=>['oil','batter','mid','gold','flipped','burnt'].map(s=>`assets/${t.id}-${s}.webp`))
 .concat(Object.values(IMG),'assets/jeon-stack.webp','assets/ajumma-body.webp');
addEventListener('load',()=>PRE.forEach(s=>{const i=new Image();i.src=s;}));

const BUB={
 start:'노릇노릇해지면 눌러요!',
 wait:['조금만 더~','아직이에요~','기다려요~'],
 flip:['홱~ 잘 뒤집었어요!','뒤집기 성공!','손놀림이 좋네요~'],
 pflip:['찰지게 뒤집었어요!!','와~ 예술이에요!'],
 side2:['뒷면도 노릇하게~','뒷면은 금방 익어요!'],
 done:['노릇노릇 완성!','맛있겠어요~','잘 부쳤어요!'],
 pdone:['완벽한 전이에요!!','손님이 감동하겠어요!'],
 early:['어이구, 덜 익었어요','조금 일렀어요~'],
 burnt:['아이고 탔어요 ㅠㅠ','타버렸네…','아까워라…']};
const pick=a=>a[Math.floor(Math.random()*a.length)];

let faceT=0;
function say(txt,face){bubble.textContent=txt;bubble.classList.remove('pop');void bubble.offsetWidth;
bubble.classList.add('pop');
if(face){ajImg.src=IMG[face];clearTimeout(faceT);
 faceT=setTimeout(()=>ajImg.src=IMG.smile,1600);}}

function toast(txt,cls){toastEl.textContent=txt;toastEl.className='';
void toastEl.offsetWidth;toastEl.className='show '+(cls||'');}
function popScore(n){scorePop.textContent='+'+n;scorePop.className='';
void scorePop.offsetWidth;scorePop.className='show';}
function flash(cls){flashEl.className='';void flashEl.offsetWidth;flashEl.className=cls;}
function burst(n,gold){for(let i=0;i<n;i++){const d=document.createElement('div');
d.className='pt'+(gold?' g':'');const a=Math.random()*Math.PI*2,r=55+Math.random()*95;
d.style.setProperty('--dx',Math.cos(a)*r+'px');
d.style.setProperty('--dy',(Math.sin(a)*r-50)+'px');
panWrap.appendChild(d);setTimeout(()=>d.remove(),800);}}

/* 주문: 대표 메뉴 45% + 나머지 랜덤, 같은 전 3연속 방지 */
function pickType(){
 let t;
 if(G.typeStreak>=2){t=pick(TYPES.filter(x=>x.id!==G.lastType));}
 else if(Math.random()<.45){t=G.selType;}
 else{t=pick(TYPES.filter(x=>x.id!==G.selType.id));}
 G.typeStreak=t.id===G.lastType?G.typeStreak+1:1;G.lastType=t.id;return t;}

/* 불 세기: 완성할수록 빨리 익고 불꽃도 커짐 */
function updateHeat(){
 const h=Math.min(6,G.count*.5);
 flameWrap.style.transform=`scale(${1+h*.05})`;
 flamesEl.style.animationDuration=(.5/(1+h*.18))+'s';
 const lvl=Math.floor(G.count/4);
 if(lvl>G.heatLvl){G.heatLvl=lvl;toast('불이 세졌어요!','good');say('불이 세졌어요! 빨리빨리~','surprised');}}

/* ── 한 장 사이클 ── */
function nextJeon(){
 const type=pickType();
 const cookMs=type.cookMs*(1-Math.min(.35,G.count*.03));
 const j=G.jeon={type,phase:'oil',t0:performance.now(),p:0,warned:false,side:1,cookMs};
 typeBadge.textContent='주문 · '+type.name;typeBadge.classList.add('on');
 for(const s in stages){stages[s].src=`assets/${type.id}-${s}.webp`;
  stages[s].style.opacity=0;stages[s].style.filter='';}
 forceStage('oil');
 jeonStack.className='';nowHint.classList.remove('on');
 jeonStack.querySelectorAll('.steam,.smoke').forEach(s=>s.classList.remove('on'));
 drawGauge(type.win);setNeedle(0);subLbl.textContent='노릇할 때 탭!';
 updateHeat();
 Sfx.cookVol(.06);Sfx.ding();
 say(pick([type.name+' 주문이요~',type.name+' 하나 추가요~','주문 들어왔어요~ '+type.name+'!']),'expect');
 later(()=>{if(G.jeon===j&&j.phase==='oil'){j.phase='pour';j.t0=performance.now();
  Sfx.pourSizzle(.9,.5);jeonStack.classList.add('drop');
  stages.batter.style.opacity=1;stages.oil.style.opacity=0;}},650);}

/* 뒤집기 성공 → 뒷면 굽기로 진행 */
function resolveFlip(q){
 const j=G.jeon;if(!j||j.resolved||j.phase!=='cook')return;j.phase='flipping';
 nowHint.classList.remove('on');
 const pts=q==='perfect'?80:40;G.score+=pts;
 jeonStack.classList.remove('sizzle','fast');jeonStack.classList.add('flip3d');
 jeonStack.querySelectorAll('.steam,.smoke').forEach(s=>s.classList.remove('on'));
 if(q==='perfect'){toast('찰진 뒤집기!','good');say(pick(BUB.pflip),'laugh');
  burst(10,true);Sfx.perfect();}
 else{toast('뒤집기!','good');say(pick(BUB.flip),'smile');burst(6,false);}
 popScore(pts);flash('good');Sfx.flip();Sfx.vibrate(40);
 vScore.textContent=G.score;
 later(()=>{if(G.jeon!==j)return;
  jeonStack.classList.remove('flip3d');
  j.side=2;j.phase='cook';j.t0=performance.now();j.p=0;j.warned=false;
  forceStage('flipped');stages.flipped.style.filter='';stages.burnt.style.opacity=0;
  drawGauge(j.type.win2);setNeedle(0);subLbl.textContent='뒷면도 노릇하게~';
  jeonStack.classList.add('sizzle');
  say(pick(BUB.side2),'expect');},520);}

/* 완성(뒷면 성공) → 접시로 서빙 */
function resolveDone(q){
 const j=G.jeon;if(!j||j.resolved)return;j.resolved=true;j.phase='done';
 nowHint.classList.remove('on');
 G.combo++;G.best=Math.max(G.best,G.combo);G.count++;
 const pts=(q==='perfect'?160:100)+(G.combo-1)*(q==='perfect'?30:20);G.score+=pts;
 jeonStack.classList.remove('sizzle','fast');jeonStack.classList.add('toPlate');
 jeonStack.querySelectorAll('.steam,.smoke').forEach(s=>s.classList.remove('on'));
 forceStage('flipped');stages.flipped.style.filter='';
 if(q==='perfect'){toast('완벽한 전!','good');say(pick(BUB.pdone),'laugh');
  burst(14,true);Sfx.perfect();}
 else{toast(pick(['노릇노릇 완성!','잘 익었어요~']),'good');say(pick(BUB.done),'proud');
  burst(8,false);}
 if(G.combo>=2)comboChip.classList.add('hot');
 comboChip.style.display='';
 popScore(pts);flash('good');Sfx.flip();Sfx.good();Sfx.vibrate(50);Sfx.cookVol(.1);
 plateEl.classList.add('on');plateCnt.textContent='x'+G.count;
 plateEl.classList.remove('bump');void plateEl.offsetWidth;plateEl.classList.add('bump');
 vScore.textContent=G.score;vCombo.textContent=G.combo;
 later(()=>{if(G.playing)nextJeon();},1150);}

/* 실패: 덜 익음 / 탐 */
function resolveFail(kind){
 const j=G.jeon;if(!j||j.resolved)return;j.resolved=true;j.phase='done';
 nowHint.classList.remove('on');
 G.combo=0;comboChip.classList.remove('hot');comboChip.style.display='none';
 if(kind==='early'){
  jeonStack.classList.add('flipBad');
  if(j.side===1)forceStage('mid');else stages.flipped.style.filter='brightness(.85)';
  toast(j.side===1?'덜 익었는데 뒤집었어요':'뒷면이 덜 익었어요','bad');
  say(pick(BUB.early),'surprised');
  flash('bad');Sfx.flip();Sfx.bad();Sfx.vibrate([60,40,60]);Sfx.cookVol(.03);
 }else{
  jeonStack.classList.add('burnShake');forceStage('burnt');
  toast('아이고 탔어요 ㅠㅠ','bad');say(pick(BUB.burnt),'worried');
  flash('bad');Sfx.bad();Sfx.vibrate([120,60,120]);Sfx.cookVol(.02);
 }
 vCombo.textContent=G.combo;
 later(()=>{if(G.playing)nextJeon();},1150);}

/* ── 탭 처리 ── */
function onTap(){
 if(!G.playing||G.paused)return;
 const j=G.jeon;if(!j||j.resolved||j.phase!=='cook')return;
 const p=j.p,w=j.side===1?j.type.win:j.type.win2;
 if(p<w[0]*.7){ // 너무 이름 → 경고만
  if(!j.warned){j.warned=true;say(pick(BUB.wait),'surprised');toast('아직이에요~','bad');}
  return;}
 if(p<w[0]){resolveFail('early');return;}
 if(p<=w[1]){
  const pw=perfectWin(w),q=p>=pw[0]&&p<=pw[1]?'perfect':'good';
  if(j.side===1)resolveFlip(q);else resolveDone(q);
 }else resolveFail('burnt');}

/* ── 메인 루프 ── */
function frame(ts){
 if(!G.playing||G.paused)return;
 const dt=ts-G.lastTs;G.lastTs=ts;
 G.timeLeft-=dt/1000;
 const tl=Math.max(0,Math.ceil(G.timeLeft));
 vTime.textContent=tl;
 timeChip.classList.toggle('low',tl<=10&&tl>0);
 if(G.timeLeft<=0){endGame();return;}
 const j=G.jeon;
 if(j&&!j.resolved){
  const el=ts-j.t0;
  if(j.phase==='pour'){
   j.p=0;if(el>=700){j.phase='cook';j.t0=ts;jeonStack.classList.add('sizzle');}
  }else if(j.phase==='cook'){
   j.p=el/(j.side===1?j.cookMs:j.cookMs*.55);
   const p=j.p,w=j.side===1?j.type.win:j.type.win2;
   if(j.side===1)showStages(p,w[0]);
   else{stages.flipped.style.filter=`brightness(${1-Math.min(.3,Math.max(0,p-.55)*.6)})`;
    stages.burnt.style.opacity=ss(.88,.99,p);}
   setNeedle(p);
   // 김치전은 색 헷갈림 → 지금이야 힌트 표시 안함
   const inWin=p>=w[0]&&p<=w[1];
   nowHint.classList.toggle('on',inWin&&j.type.id!=='kimchi');
   jeonStack.classList.toggle('fast',inWin);
   jeonStack.querySelectorAll('.steam').forEach(s=>s.classList.toggle('on',p>w[0]*.75&&p<.93));
   jeonStack.querySelectorAll('.smoke').forEach(s=>s.classList.toggle('on',p>=.93));
   Sfx.cookVol(p<w[0]?.08+p*.1:p<=w[1]?.22:.3);
   if(p>=1){resolveFail('burnt');}
  }
 }
 G.raf=requestAnimationFrame(frame);}

/* ── 일시정지 ── */
function pauseGame(){
 if(!G.playing||G.paused)return;
 G.paused=true;G.hiddenAt=performance.now();
 cancelAnimationFrame(G.raf);Sfx.cookVol(0);
 pauseOv.classList.remove('hidden');}
function resumeGame(){
 if(!G.paused)return;
 const shift=performance.now()-G.hiddenAt;
 if(G.jeon)G.jeon.t0+=shift;
 G.lastTs=performance.now();G.paused=false;
 pauseOv.classList.add('hidden');
 G.raf=requestAnimationFrame(frame);}
function quitToHome(){
 G.playing=false;G.paused=false;cancelAnimationFrame(G.raf);clearTimers();Sfx.cookStop();
 pauseOv.classList.add('hidden');endOv.classList.add('hidden');
 nowHint.classList.remove('on');typeBadge.classList.remove('on');
 startOv.classList.remove('hidden');say(BUB.start);}

/* ── 게임 시작/끝 ── */
function startGame(){
 Sfx.ensure();
 clearTimers();
 G.playing=true;G.paused=false;G.score=0;G.combo=0;G.best=0;G.count=0;G.timeLeft=60;
 G.lastType='';G.typeStreak=0;G.heatLvl=0;
 vScore.textContent='0';vCombo.textContent='0';vTime.textContent='60';
 comboChip.classList.remove('hot');comboChip.style.display='none';timeChip.classList.remove('low');plateEl.classList.remove('on');
 startOv.classList.add('hidden');endOv.classList.add('hidden');pauseOv.classList.add('hidden');
 $('flipBtn').disabled=false;
 Sfx.cookStart();
 nextJeon();
 G.lastTs=performance.now();G.raf=requestAnimationFrame(frame);}
function endGame(){
 G.playing=false;G.paused=false;cancelAnimationFrame(G.raf);clearTimers();Sfx.cookStop();
 nowHint.classList.remove('on');typeBadge.classList.remove('on');
 $('endJeon').textContent=G.count;
 $('endScore').textContent=G.score;
 $('endCombo').textContent='최고 콤보 x'+G.best;
 const n=G.count>=8?3:G.count>=5?2:G.count>=2?1:0;
 $('stars').innerHTML=[1,2,3].map(i=>`<span class="${i<=n?'':'off'}">★</span>`).join('');
 $('endSub').textContent=n>=3?'와! 정말 잘 부쳤어요!':n===2?'맛있게 부쳤어요!':n===1?'조금 아쉬워요':'앗, 전이 다 타버렸네요…';
 $('endQuote').textContent=n>=3?'“역시 전 뒤집기 달인이시네요!”':n===2?'“맛있는 하루예요 :)”':n===1?'“한 장만 더 해봐요~”':'“다시 한번 해봐요!”';
 endOv.classList.remove('hidden');}

/* ── 이벤트 ── */
document.addEventListener('pointerdown',e=>{
 if(e.target.closest('.overlay,#flipBtn,#sfxBtn,#pauseBtn'))return;
 onTap();},{passive:true});
$('flipBtn').addEventListener('pointerdown',e=>{e.preventDefault();onTap();});
$('startBtn').addEventListener('click',startGame);
$('retryBtn').addEventListener('click',startGame);
$('otherBtn').addEventListener('click',()=>{endOv.classList.add('hidden');startOv.classList.remove('hidden');
say('이번엔 어떤 전을 부쳐볼까요?','expect');});
$('homeBtn').addEventListener('click',()=>{endOv.classList.add('hidden');startOv.classList.remove('hidden');
say(BUB.start);});
$('homeBtn2').addEventListener('click',quitToHome);
$('pauseBtn').addEventListener('click',pauseGame);
$('resumeBtn').addEventListener('click',resumeGame);
sfxBtn.textContent=Sfx.isMuted()?'🔇':'🔊';
sfxBtn.addEventListener('click',()=>{Sfx.ensure();Sfx.setMuted(!Sfx.isMuted());
sfxBtn.textContent=Sfx.isMuted()?'🔇':'🔊';});
document.querySelectorAll('.typeCard').forEach(c=>{
 c.addEventListener('pointerdown',()=>{
  document.querySelectorAll('.typeCard').forEach(x=>x.classList.remove('sel'));
  c.classList.add('sel');
  G.selType=TYPES.find(t=>t.id===c.dataset.t);});});
/* 백그라운드로 가면 일시정지 (전 타버림/시간 점프 방지) */
document.addEventListener('visibilitychange',()=>{
 if(!G.playing)return;
 if(document.hidden)pauseGame();
 else if(G.paused)resumeGame();});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
