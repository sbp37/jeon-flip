<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>전 뒤집기</title>
<meta name="description" content="노릇노릇할 때 탭! 60초 안에 전을 최대한 많이 뒤집는 1탭 타이밍 미니게임">
<style>
:root{
  --ivory:#f8f1e4; --cream:#fff8ec; --brown:#6b4a2f; --brown-d:#4a3018;
  --orange:#f08a2d; --orange-d:#d96f1a; --green:#7cb342; --red:#e05b3a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:linear-gradient(180deg,#f6ecda 0%,#efe0c8 55%,#e8d3b4 100%);
  font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
  color:var(--brown-d); user-select:none; -webkit-user-select:none;
  touch-action:manipulation; overflow:hidden;
}
#app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* ── HUD ─────────────────────────────── */
#hud{display:flex;gap:8px;padding:12px 14px 6px}
.stat{flex:1;background:var(--cream);border:2.5px solid #e6d2ae;border-radius:16px;padding:6px 4px;text-align:center;box-shadow:0 3px 0 #e0cba4}
.stat .label{font-size:14px;font-weight:700;color:#a08464}
.stat .value{font-size:30px;font-weight:900;color:#5b3a1e;line-height:1.1}
#statTime .value.low{color:var(--red);animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#statCombo .value{color:var(--orange-d)}
#statCombo.hot .value{animation:pulse .4s infinite}

/* ── 아주머니 + 말풍선 ─────────────────── */
#ajRow{display:flex;align-items:center;gap:10px;padding:2px 16px;min-height:74px}
#ajImg{width:62px;height:62px;border-radius:50%;border:3px solid #e6d2ae;background:var(--cream);object-fit:cover;flex:none;box-shadow:0 2px 0 #e0cba4}
#bubble{position:relative;background:#fff;border:2.5px solid #e6d2ae;border-radius:16px;padding:8px 14px;font-size:19px;font-weight:700;color:#5b3a1e;line-height:1.35;max-width:78%}
#bubble::before{content:'';position:absolute;left:-9px;top:18px;width:14px;height:14px;background:#fff;border-left:2.5px solid #e6d2ae;border-bottom:2.5px solid #e6d2ae;transform:rotate(45deg)}
#bubble.pop{animation:bubblePop .25s ease-out}
@keyframes bubblePop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ── 팬 영역 ─────────────────────────── */
#playArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 16px}
#gaugeWrap{width:min(84vw,380px);margin-bottom:-8px}
#gauge{width:100%;display:block}
#gauge text{font-size:15px;font-weight:800}
#typeBadge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;font-size:17px;font-weight:800;padding:4px 16px;border-radius:999px;z-index:3;box-shadow:0 2px 0 rgba(0,0,0,.15);opacity:0;transition:opacity .2s}
#typeBadge.on{opacity:1}
#panWrap{position:relative;width:min(74vw,330px);aspect-ratio:1;flex:none}
#panHandle{position:absolute;right:-16%;bottom:2%;width:34%;height:11%;background:linear-gradient(180deg,#8a8a8a,#5f5f5f);border-radius:999px;transform:rotate(-38deg);transform-origin:left center;box-shadow:inset 0 -4px 6px rgba(0,0,0,.4)}
#panHandle::before{content:'';position:absolute;left:-4px;top:10%;width:26%;height:80%;background:#4a4a4a;border-radius:10px}
#pan{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#565656 0%,#3d3d3d 55%,#262626 78%,#1a1a1a 100%);
  box-shadow:inset 0 -14px 22px rgba(0,0,0,.55),inset 0 8px 14px rgba(255,255,255,.12),0 14px 26px rgba(90,60,30,.35);
  border:6px solid #303030}
#oil{position:absolute;inset:16%;border-radius:50%;
  background:radial-gradient(circle at 45% 40%,rgba(255,205,110,.55),rgba(220,150,50,.28) 60%,rgba(200,130,40,.12) 100%);
  opacity:0;transition:opacity .35s}
#oil.on{opacity:1;animation:oilShimmer 1.1s ease-in-out infinite}
@keyframes oilShimmer{50%{transform:scale(1.03);filter:brightness(1.15)}}
#jeon{position:absolute;inset:14%;border-radius:50%;opacity:0;
  transform:scale(.4);box-shadow:inset 0 -8px 14px rgba(120,60,10,.28),inset 0 6px 10px rgba(255,255,255,.35)}
#jeon.drop{animation:jeonDrop .55s ease-out forwards}
@keyframes jeonDrop{0%{opacity:1;transform:scale(.25)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
#jeon.cooking{opacity:1;transform:scale(1)}
#jeon.sizzle{animation:sizzleWob .5s ease-in-out infinite}
#jeon.sizzle.fast{animation-duration:.28s}
@keyframes sizzleWob{0%,100%{transform:scale(1) rotate(0deg)}30%{transform:scale(1.012) rotate(.6deg)}70%{transform:scale(.998) rotate(-.5deg)}}
#jeon.flipGood{animation:flipGood .6s ease-out}
@keyframes flipGood{30%{transform:translateY(-14%) scale(1.06) rotate(6deg)}100%{transform:translateY(0) scale(1)}}
#jeon.flipBad{animation:flipBad .5s ease-out}
@keyframes flipBad{30%{transform:translateY(-6%) scale(.98)}100%{transform:translateY(0) scale(1)}}
#jeon.burnShake{animation:burnShake .5s ease-in-out}
@keyframes burnShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#jeon .shine{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.34) 0%,rgba(255,255,255,.1) 26%,transparent 45%)}
.topping{position:absolute;pointer-events:none;transition:filter .3s}
.tp-chive{background:linear-gradient(90deg,#5e9c3f,#7cb84e);border-radius:6px;box-shadow:inset 0 -2px 3px rgba(0,60,0,.3)}
.tp-kimchi{background:radial-gradient(circle at 40% 35%,#e0532e,#b03318);border-radius:45% 55% 50% 50%}
.tp-shrimp{background:radial-gradient(circle at 35% 30%,#ffb38f,#f07f52);border-radius:60% 40% 55% 45%}
.tp-carrot{background:#f0903c;border-radius:4px}
.tp-onion{background:radial-gradient(circle at 40% 35%,#fdf3d8,#ecd9a8);border-radius:50%}
.steam{position:absolute;width:14px;height:22px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.75),transparent 70%);
  opacity:0;pointer-events:none}
.steam.on{animation:steamUp 1.4s ease-out infinite}
.steam.on.s2{animation-delay:.45s}.steam.on.s3{animation-delay:.9s}
@keyframes steamUp{0%{opacity:0;transform:translateY(0) scale(.7)}25%{opacity:.9}100%{opacity:0;transform:translateY(-70px) scale(1.5)}}
.smoke{position:absolute;width:18px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(90,90,90,.6),transparent 70%);opacity:0;pointer-events:none}
.smoke.on{animation:steamUp 1.2s ease-out infinite}
#nowHint{position:absolute;top:-34px;left:50%;transform:translateX(-50%) scale(0);
  background:var(--orange);color:#fff;font-size:20px;font-weight:900;padding:6px 18px;border-radius:999px;
  box-shadow:0 3px 0 var(--orange-d);transition:transform .15s;z-index:4;white-space:nowrap}
#nowHint.on{transform:translateX(-50%) scale(1);animation:nowPulse .4s infinite}
@keyframes nowPulse{50%{transform:translateX(-50%) scale(1.1)}}

/* 결과 토스트 */
#toast{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);
  z-index:5;white-space:nowrap;pointer-events:none}
#toast.show{animation:toastPop 1s ease-out forwards}
@keyframes toastPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
#toast.good{color:#ffd54a}
#toast.bad{color:#e8e0d0}
#scorePop{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:900;color:var(--green);opacity:0;pointer-events:none;z-index:5}
#scorePop.show{animation:scoreUp .9s ease-out forwards}
@keyframes scoreUp{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}

/* 화면 플래시 */
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
#flash.good{background:radial-gradient(circle,rgba(255,190,60,.28),transparent 70%);animation:flashA .45s ease-out}
#flash.bad{background:radial-gradient(circle,rgba(60,50,40,.3),transparent 70%);animation:flashA .45s ease-out}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}

/* ── 뒤집기 버튼 ─────────────────────── */
#flipBtn{margin:6px 16px 20px;height:104px;border:none;border-radius:26px;
  background:linear-gradient(180deg,#ff9d45,#f07f1e);color:#fff;
  font-size:40px;font-weight:900;letter-spacing:2px;
  box-shadow:0 7px 0 #c55f0e,0 12px 20px rgba(140,80,20,.35);
  font-family:inherit;cursor:pointer}
#flipBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #c55f0e}
#flipBtn .sub{display:block;font-size:16px;font-weight:700;opacity:.9;margin-top:2px}
#flipBtn:disabled{filter:grayscale(.4) brightness(.92)}

/* ── 오버레이 ────────────────────────── */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(60,40,20,.45);backdrop-filter:blur(2px);padding:20px}
.overlay.hidden{display:none}
.card{width:100%;max-width:400px;background:var(--cream);border:3px solid #e6d2ae;border-radius:26px;
  padding:28px 22px;text-align:center;box-shadow:0 16px 40px rgba(60,40,10,.35)}
.card h1{font-size:44px;font-weight:900;color:var(--brown-d);letter-spacing:1px}
.card .sub{font-size:19px;font-weight:700;color:#8a6a45;margin:8px 0 16px;line-height:1.5}
.typeChips{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.typeChips span{background:#f3e6cc;border:2px solid #e0c89a;border-radius:999px;padding:6px 14px;font-size:17px;font-weight:800;color:#7a5a30}
.card img.ajFace{width:110px;height:110px;border-radius:50%;border:3px solid #e6d2ae;object-fit:cover;margin-bottom:6px}
.bigBtn{display:block;width:100%;height:88px;margin-top:10px;border:none;border-radius:20px;
  background:linear-gradient(180deg,#ff9d45,#f07f1e);color:#fff;font-size:32px;font-weight:900;
  font-family:inherit;box-shadow:0 6px 0 #c55f0e;cursor:pointer}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #c55f0e}
#endScore{font-size:56px;font-weight:900;color:var(--orange-d);line-height:1.1}
#endCount{font-size:24px;font-weight:800;color:#5b3a1e;margin-top:4px}
#endCombo{font-size:17px;font-weight:700;color:#8a6a45;margin-top:2px}
#stars{font-size:40px;letter-spacing:6px;margin:6px 0}
#stars .off{opacity:.28}
.hintLine{font-size:15px;color:#a08464;font-weight:600;margin-top:12px;line-height:1.6}
@media (max-height: 720px){
  #hud{padding:8px 12px 4px}
  .stat{padding:4px 2px;border-radius:12px}
  .stat .value{font-size:24px}
  .stat .label{font-size:12px}
  #ajRow{min-height:56px;padding:0 14px}
  #ajImg{width:46px;height:46px}
  #bubble{font-size:16px;padding:6px 12px}
  #gaugeWrap{width:min(66vw,300px,27dvh)}
  #panWrap{width:min(66vw,300px,40dvh)}
  #flipBtn{height:88px;font-size:34px;margin:4px 14px 14px}
  #flipBtn .sub{font-size:14px}
  .card{padding:20px 18px;max-height:94dvh;overflow:auto}
  .card h1{font-size:34px}
  .card img.ajFace{width:88px;height:88px}
  .bigBtn{height:72px;font-size:26px}
  #endScore{font-size:44px}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><div class="label">점수</div><div class="value" id="vScore">0</div></div>
    <div class="stat" id="statTime"><div class="label">시간</div><div class="value" id="vTime">60</div></div>
    <div class="stat" id="statCombo"><div class="label">콤보</div><div class="value" id="vCombo">0</div></div>
  </header>

  <div id="ajRow">
    <img id="ajImg" src="assets/ajumma-happy.webp" alt="전집 아주머니">
    <div id="bubble">노릇노릇해지면 눌러요!</div>
  </div>

  <div id="playArea">
    <div id="gaugeWrap">
      <svg id="gauge" viewBox="0 0 200 136" aria-hidden="true">
        <path id="arcRaw"   fill="none" stroke="#d9c9a8" stroke-width="14" stroke-linecap="round"/>
        <path id="arcGood"  fill="none" stroke="#7cb342" stroke-width="14" stroke-linecap="round"/>
        <path id="arcOver"  fill="none" stroke="#e05b3a" stroke-width="14" stroke-linecap="round"/>
        <circle id="needle" r="9" fill="#fff" stroke="#5b3a1e" stroke-width="3.5"/>
        <text x="100" y="134" text-anchor="middle" fill="#a08464">익음 정도</text>
      </svg>
    </div>
    <div id="panWrap">
      <div id="typeBadge"></div>
      <div id="nowHint">지금이야!</div>
      <div id="panHandle"></div>
      <div id="pan">
        <div id="oil"></div>
        <div id="jeon"><div class="shine"></div><div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div><div class="smoke sm1"></div></div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="scorePop"></div>
  </div>

  <button id="flipBtn" type="button">뒤집기!<span class="sub">화면 아무 데나 눌러도 돼요</span></button>
</div>
<div id="flash"></div>

<div class="overlay" id="startOv">
  <div class="card">
    <img class="ajFace" src="assets/ajumma-happy.webp" alt="">
    <h1>전 뒤집기</h1>
    <p class="sub">지글지글~ 노릇노릇해지는 순간<br><b>딱 한 번</b> 누르면 돼요!</p>
    <div class="typeChips"><span>부추전</span><span>김치전</span><span>해물전</span></div>
    <button class="bigBtn" id="startBtn" type="button">시작하기</button>
    <p class="hintLine">60초 동안 최대한 많이!<br>너무 빨리 누르면 덜 익고, 늦으면 타버려요</p>
  </div>
</div>

<div class="overlay hidden" id="endOv">
  <div class="card">
    <img class="ajFace" id="endAj" src="assets/ajumma-happy.webp" alt="">
    <h1 style="font-size:34px">오늘 전 <span id="endJeon">0</span>장!</h1>
    <div id="stars"></div>
    <div id="endScore">0</div>
    <div id="endCount">점수</div>
    <div id="endCombo"></div>
    <button class="bigBtn" id="retryBtn" type="button">다시 하기</button>
  </div>
</div>

<script>
'use strict';
/* ═══════════ 사운드 (WebAudio 합성) ═══════════ */
const Sfx=(()=>{let ctx=null,master=null,crackleBuf=null,cookGain=null,cookSrc=null;
function ensure(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);}
if(ctx.state==='suspended')ctx.resume();}
function noiseBuf(dur){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
// 지글지글 루프용 버퍼: 잡음 + 랜덤 튀는 팝
function crackle(dur){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
let e=0;for(let i=0;i<n;i++){if(Math.random()<.0035)e=1;e*=.994;
d[i]=(Math.random()*2-1)*(.06+e*.55);}return b;}
// 짧은 튀는 소리 하나
function pop(t,vol,f){const s=ctx.createBufferSource();s.buffer=noiseBuf(.03);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);}
// 반죽 부을 때 "치익~": 강한 지글 노이즈 + 연속 팝
function pourSizzle(dur=.9,vol=.55){if(!ctx)return;const t=ctx.currentTime;
const s=ctx.createBufferSource();s.buffer=noiseBuf(dur);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(5200,t);
bp.frequency.exponentialRampToValueAtTime(3400,t+dur);bp.Q.value=.8;
const g=ctx.createGain();g.gain.setValueAtTime(.001,t);
g.gain.exponentialRampToValueAtTime(vol,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+dur);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
const pops=Math.floor(dur*40);for(let i=0;i<pops;i++)pop(t+Math.random()*dur,vol*(.3+Math.random()*.7),3000+Math.random()*5000);
// 기름 끼리끼리 저음
const ls=ctx.createBufferSource();ls.buffer=noiseBuf(dur*.7);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
const lg=ctx.createGain();lg.gain.setValueAtTime(.001,t);lg.gain.exponentialRampToValueAtTime(vol*.35,t+.08);
lg.gain.exponentialRampToValueAtTime(.001,t+dur*.7);
ls.connect(lp);lp.connect(lg);lg.connect(master);ls.start(t);}
// 익는 동안 잔잔한 지글거림 루프
function cookStart(){if(!ctx)return;cookStop();
crackleBuf=crackleBuf||crackle(2.5);
cookSrc=ctx.createBufferSource();cookSrc.buffer=crackleBuf;cookSrc.loop=true;
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4200;bp.Q.value=.7;
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;
cookGain=ctx.createGain();cookGain.gain.value=0;
cookSrc.connect(bp);bp.connect(lp);lp.connect(cookGain);cookGain.connect(master);cookSrc.start();}
function cookVol(v){if(cookGain&&ctx)cookGain.gain.setTargetAtTime(v,ctx.currentTime,.1);}
function cookStop(){if(cookSrc){try{cookSrc.stop();}catch(e){}cookSrc=null;cookGain=null;}}
// 뒤집기: 휙 + 팬에 착
function flip(){if(!ctx)return;const t=ctx.currentTime;
const s=ctx.createBufferSource();s.buffer=noiseBuf(.12);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(1600,t);
bp.frequency.exponentialRampToValueAtTime(500,t+.12);bp.Q.value=1.5;
const g=ctx.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(200,t+.05);
o.frequency.exponentialRampToValueAtTime(70,t+.17);
const og=ctx.createGain();og.gain.setValueAtTime(.5,t+.05);og.gain.exponentialRampToValueAtTime(.001,t+.19);
o.connect(og);og.connect(master);o.start(t+.05);o.stop(t+.2);
pop(t+.06,.5,1400);}
// 성공: 따뜻한 두 음
function good(){if(!ctx)return;const t=ctx.currentTime;[660,880].forEach((f,i)=>{
const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
const g=ctx.createGain();const st=t+.07*i;g.gain.setValueAtTime(.001,st);
g.gain.exponentialRampToValueAtTime(.28,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.25);
o.connect(g);g.connect(master);o.start(st);o.stop(st+.3);});}
// 실패: 낮은 부저
function bad(){if(!ctx)return;const t=ctx.currentTime;
const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(180,t);
o.frequency.exponentialRampToValueAtTime(80,t+.35);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;
const g=ctx.createGain();g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+.42);}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
return{ensure,pourSizzle,cookStart,cookVol,cookStop,flip,good,bad,vibrate};})();

/* ═══════════ 전 종류 ═══════════ */
const TYPES=[
 {id:'buchu',name:'부추전',cookMs:4200,win:[.60,.80],
  c:['#f7ecca','#f2d488','#eaa53f','#a05a1c','#452a14'],
  edge:['#d9c294','#c99b4e','#9c5e1a','#6e3a10','#2a180a'],
  tops:[['chive',12],['carrot',5]]},
 {id:'kimchi',name:'김치전',cookMs:3800,win:[.64,.78],
  c:['#f3d2a8','#eda574','#d96a34','#8a3a16','#3c1e10'],
  edge:['#d9a878','#c07a48','#96401a','#5c240c','#241006'],
  tops:[['kimchi',11],['chive',4]]},
 {id:'haemul',name:'해물전',cookMs:5200,win:[.70,.81],
  c:['#f7eed4','#f0dca4','#e2a84e','#9c5c1e','#402612'],
  edge:['#dcc79c','#cfa45c','#a06a24','#6e3e12','#281608'],
  tops:[['shrimp',5],['chive',8],['onion',4]]},
];

const $=id=>document.getElementById(id);
const vScore=$('vScore'),vTime=$('vTime'),vCombo=$('vCombo'),statTime=$('statTime'),statCombo=$('statCombo');
const bubble=$('bubble'),ajImg=$('ajImg'),typeBadge=$('typeBadge');
const jeonEl=$('jeon'),oilEl=$('oil'),panWrap=$('panWrap'),nowHint=$('nowHint');
const toastEl=$('toast'),scorePop=$('scorePop'),flashEl=$('flash');
const startOv=$('startOv'),endOv=$('endOv');

const IMG={happy:'assets/ajumma-happy.webp',worried:'assets/ajumma-worried.webp',surprised:'assets/ajumma-surprised.webp'};

/* 색 보간 */
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lerpC(a,b,t){const A=hx(a),B=hx(b);
return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;}
// stages: 0=생반죽 1=익는중 2=노릇 3=탐직전 4=탐
function stageColor(arr,p){
 if(p<.42)return lerpC(arr[0],arr[1],p/.42);
 if(p<.60)return lerpC(arr[1],arr[2],(p-.42)/.18);
 if(p<.80)return arr[2];
 if(p<.93)return lerpC(arr[2],arr[3],(p-.80)/.13);
 return lerpC(arr[3],arr[4],Math.min(1,(p-.93)/.07));}

/* 게이지 arc */
const GA={cx:100,cy:100,r:72,a0:155,a1:385}; // deg, 상단을 크게 도는 호
function arcPath(t0,t1){const rad=d=>d*Math.PI/180;
const x0=GA.cx+GA.r*Math.cos(rad(GA.a0+(GA.a1-GA.a0)*t0));
const y0=GA.cy+GA.r*Math.sin(rad(GA.a0+(GA.a1-GA.a0)*t0));
const x1=GA.cx+GA.r*Math.cos(rad(GA.a0+(GA.a1-GA.a0)*t1));
const y1=GA.cy+GA.r*Math.sin(rad(GA.a0+(GA.a1-GA.a0)*t1));
const laf=(t1-t0)*(GA.a1-GA.a0)>180?1:0;return`M ${x0} ${y0} A ${GA.r} ${GA.r} 0 ${laf} 1 ${x1} ${y1}`;}
function needleAt(p){const rad=d=>d*Math.PI/180,a=GA.a0+(GA.a1-GA.a0)*p;
return[GA.cx+GA.r*Math.cos(rad(a)),GA.cy+GA.r*Math.sin(rad(a))];}
function drawGauge(win){$('arcRaw').setAttribute('d',arcPath(.02,win[0]));
$('arcGood').setAttribute('d',arcPath(win[0],win[1]));
$('arcOver').setAttribute('d',arcPath(win[1],.98));}

/* ═══════════ 게임 상태 ═══════════ */
const G={playing:false,score:0,combo:0,best:0,count:0,timeLeft:60,
 jeon:null,last2:[],lastTs:0,raf:0};

const BUB={
 start:'노릇노릇해지면 눌러요!',
 wait:['조금만 더~','아직이에요~','기다려요~'],
 good:['잘 뒤집었어요!','노릇노릇~','완벽해요!','아주 맛있겠어요!'],
 early:['어이구, 덜 익었어요','조금 일렀어요~'],
 burnt:['아이고 탔어요 ㅠㅠ','타버렸네…','아까워라…'],
 pour:'자, 새 전 부칠게요~'};
const pick=a=>a[Math.floor(Math.random()*a.length)];

let faceT=0;
function say(txt,face){bubble.textContent=txt;bubble.classList.remove('pop');void bubble.offsetWidth;
bubble.classList.add('pop');
if(face){ajImg.src=IMG[face];clearTimeout(faceT);
 faceT=setTimeout(()=>ajImg.src=IMG.happy,1600);}}

function toast(txt,cls){toastEl.textContent=txt;toastEl.className='';
void toastEl.offsetWidth;toastEl.className='show '+(cls||'');}
function popScore(n){scorePop.textContent='+'+n;scorePop.className='';
void scorePop.offsetWidth;scorePop.className='show';}
function flash(cls){flashEl.className='';void flashEl.offsetWidth;flashEl.className=cls;}

/* ── 토핑 생성 ── */
function buildToppings(type){
 jeonEl.querySelectorAll('.topping').forEach(e=>e.remove());
 const box=jeonEl.clientWidth||260;
 type.tops.forEach(([kind,n])=>{for(let i=0;i<n;i++){
  const el=document.createElement('div');el.className='topping tp-'+kind;
  // 원 안 균등 분포
  const r=Math.sqrt(Math.random())*.36+ .02,th=Math.random()*Math.PI*2;
  const x=50+Math.cos(th)*r*100,y=50+Math.sin(th)*r*100;
  let w,h,rot=Math.random()*180;
  if(kind==='chive'){w=box*.16*(0.7+Math.random()*.6);h=box*.045;}
  else if(kind==='carrot'){w=box*.10;h=box*.035;}
  else if(kind==='kimchi'){w=box*.07*(0.8+Math.random()*.5);h=w*.8;}
  else if(kind==='shrimp'){w=box*.13;h=box*.09;}
  else{w=box*.06;h=box*.06;}
  el.style.cssText=`left:${x}%;top:${y}%;width:${w}px;height:${h}px;transform:translate(-50%,-50%) rotate(${rot}deg)`;
  jeonEl.appendChild(el);}});}

/* ── 한 장 사이클 ── */
function nextJeon(){
 let type;do{type=TYPES[Math.floor(Math.random()*TYPES.length)];}
 while(G.last2.length===2&&G.last2[0]===G.last2[1]&&type.id===G.last2[0]);
 G.last2.push(type.id);if(G.last2.length>2)G.last2.shift();
 G.jeon={type,phase:'oil',t0:performance.now(),p:0,warned:false};
 typeBadge.textContent=type.name;typeBadge.classList.add('on');
 oilEl.classList.add('on');
 jeonEl.className='';jeonEl.style.background='';nowHint.classList.remove('on');
 jeonEl.querySelectorAll('.topping').forEach(e=>e.remove());
 jeonEl.querySelectorAll('.steam,.smoke').forEach(s=>s.classList.remove('on'));
 drawGauge(type.win);setNeedle(0);
 Sfx.cookVol(.06);
 say(pick(['자, 새 전 부칠게요~',type.name+' 나갑니다~','기름 달궈졌어요~']));
 setTimeout(()=>{if(G.jeon&&G.jeon.phase==='oil'){G.jeon.phase='pour';G.jeon.t0=performance.now();
  Sfx.pourSizzle(.9,.5);const t=G.jeon.type;
  jeonEl.style.background=`radial-gradient(circle at 45% 40%, ${t.c[0]} 55%, ${t.edge[0]} 92%)`;
  jeonEl.classList.add('drop');buildToppings(t);}},650);}
function setNeedle(p){const[x,y]=needleAt(Math.max(0,Math.min(1,p)));
const n=$('needle');n.setAttribute('cx',x);n.setAttribute('cy',y);}

function resolveJeon(result){ // 'good' | 'early' | 'burnt'
 const j=G.jeon;if(!j||j.resolved)return;j.resolved=true;j.phase='done';j.doneT=performance.now();
 nowHint.classList.remove('on');
 if(result==='good'){
  G.combo++;G.best=Math.max(G.best,G.combo);G.count++;
  const pts=100+(G.combo-1)*20;G.score+=pts;
  jeonEl.classList.add('flipGood');
  jeonEl.style.background=`radial-gradient(circle at 45% 40%, ${j.type.c[2]} 55%, ${j.type.edge[2]} 92%)`;
  toast(pick(['노릇노릇~','잘 뒤집었어요!']),'good');say(pick(BUB.good),'happy');
  popScore(pts);flash('good');Sfx.flip();Sfx.good();Sfx.vibrate(40);
  if(G.combo>=2){toast('콤보 x'+G.combo+'!','good');statCombo.classList.add('hot');}
  Sfx.cookVol(.12);
 }else if(result==='early'){
  G.combo=0;statCombo.classList.remove('hot');
  jeonEl.classList.add('flipBad');
  jeonEl.style.background=`radial-gradient(circle at 45% 40%, ${j.type.c[0]} 55%, ${j.type.edge[0]} 92%)`;
  toast('덜 익었어요','bad');say(pick(BUB.early),'surprised');
  flash('bad');Sfx.flip();Sfx.bad();Sfx.vibrate([60,40,60]);Sfx.cookVol(.03);
 }else{
  G.combo=0;statCombo.classList.remove('hot');
  jeonEl.classList.add('burnShake');
  jeonEl.style.background=`radial-gradient(circle at 45% 40%, ${j.type.c[4]} 55%, ${j.type.edge[4]} 92%)`;
  toast('아이고 탔어요 ㅠㅠ','bad');say(pick(BUB.burnt),'worried');
  flash('bad');Sfx.bad();Sfx.vibrate([120,60,120]);Sfx.cookVol(.02);
 }
 vScore.textContent=G.score;vCombo.textContent=G.combo;
 setTimeout(()=>{if(G.playing)nextJeon();},1150);}

/* ── 탭 처리 ── */
function onTap(e){
 if(!G.playing)return;
 const j=G.jeon;if(!j||j.resolved)return;
 if(j.phase!=='cook')return;
 const p=j.p,w=j.type.win;
 if(p<w[0]*.7){ // 너무 이름 → 경고만
  if(!j.warned){j.warned=true;say(pick(BUB.wait),'surprised');toast('아직이에요~','bad');}
  return;}
 if(p<w[0])resolveJeon('early');
 else if(p<=w[1])resolveJeon('good');
 else resolveJeon('burnt');}

/* ── 메인 루프 ── */
function frame(ts){
 if(!G.playing)return;
 const dt=ts-G.lastTs;G.lastTs=ts;
 // 타이머
 G.timeLeft-=dt/1000;
 const tl=Math.max(0,Math.ceil(G.timeLeft));
 vTime.textContent=tl;
 statTime.querySelector('.value').classList.toggle('low',tl<=10&&tl>0);
 if(G.timeLeft<=0){endGame();return;}
 const j=G.jeon;
 if(j&&!j.resolved){
  const el=ts-j.t0;
  if(j.phase==='pour'){
   j.p=0;const k=Math.min(1,el/700);
   if(k>=1){j.phase='cook';j.t0=ts;jeonEl.classList.add('cooking','sizzle');}
  }else if(j.phase==='cook'){
   j.p=el/j.type.cookMs;
   const p=j.p,w=j.type.win;
   // 색상
   const base=stageColor(j.type.c,p),edge=stageColor(j.type.edge,p);
   jeonEl.style.background=`radial-gradient(circle at 45% 40%, ${base} 55%, ${edge} 92%)`;
   setNeedle(p);
   // 김치전은 색 헷갈림 → 지금이야 힌트 표시 안함 (구간만 짧게)
   const inWin=p>=w[0]&&p<=w[1];
   nowHint.classList.toggle('on',inWin&&j.type.id!=='kimchi');
   jeonEl.classList.toggle('fast',inWin);
   // 스팀/연기
   jeonEl.querySelectorAll('.steam').forEach(s=>s.classList.toggle('on',p>w[0]*.75&&p<.93));
   jeonEl.querySelectorAll('.smoke').forEach(s=>s.classList.toggle('on',p>=.93));
   // 지글거림 볼륨: 익을수록 커지다가 타면 시끄럽게
   Sfx.cookVol(p<w[0]?.08+p*.1:p<=w[1]?.22:.3);
   if(p>=1){resolveJeon('burnt');}
  }
 }
 G.raf=requestAnimationFrame(frame);}

/* ── 게임 시작/끝 ── */
function startGame(){
 Sfx.ensure();
 G.playing=true;G.score=0;G.combo=0;G.best=0;G.count=0;G.timeLeft=60;
 vScore.textContent='0';vCombo.textContent='0';vTime.textContent='60';
 statCombo.classList.remove('hot');
 startOv.classList.add('hidden');endOv.classList.add('hidden');
 $('flipBtn').disabled=false;
 Sfx.cookStart();
 nextJeon();
 G.lastTs=performance.now();G.raf=requestAnimationFrame(frame);}
function endGame(){
 G.playing=false;cancelAnimationFrame(G.raf);Sfx.cookStop();
 nowHint.classList.remove('on');typeBadge.classList.remove('on');
 $('endJeon').textContent=G.count;
 $('endScore').textContent=G.score;
 $('endCombo').textContent='최고 콤보 x'+G.best;
 const n=G.count>=15?3:G.count>=9?2:1;
 $('stars').innerHTML=[1,2,3].map(i=>`<span class="${i<=n?'':'off'}">★</span>`).join('');
 $('endAj').src=IMG[n>=2?'happy':'surprised'];
 say(n>=2?'와~ 정말 잘 부쳤어요!':'다음엔 더 잘할 거예요!');
 endOv.classList.remove('hidden');}

/* ── 이벤트 ── */
document.addEventListener('pointerdown',e=>{
 if(e.target.closest('.overlay')||e.target.closest('#flipBtn'))return;
 onTap(e);},{passive:true});
$('flipBtn').addEventListener('pointerdown',e=>{e.preventDefault();onTap(e);});
$('startBtn').addEventListener('click',startGame);
$('retryBtn').addEventListener('click',startGame);
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
