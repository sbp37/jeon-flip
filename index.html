<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>전 뒤집기</title>
<meta name="description" content="노릇노릇할 때 탭! 60초 안에 전을 최대한 많이 뒤집는 1탭 타이밍 미니게임">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f8f1e4; --paper:#fdf6e9; --brown:#6b4a2f; --brown-d:#4a3018;
  --orange:#f08a2d; --green:#7cb342; --red:#e05b3a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#e8d5b4 url('assets/bg-table.webp') center/cover no-repeat fixed;
  font-family:'Jua','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
  color:var(--brown-d); user-select:none; -webkit-user-select:none;
  touch-action:manipulation; overflow:hidden;
}
#app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* ── HUD ─────────────────────────────── */
#hud{display:flex;gap:8px;padding:12px 14px 6px}
.stat{flex:1;background:var(--paper);border:3px solid #c9a875;border-radius:16px;padding:5px 4px 7px;text-align:center;box-shadow:0 4px 0 #b8946a}
.stat .label{font-size:14px;color:#a08464}
.stat .value{font-size:30px;color:#5b3a1e;line-height:1.1}
#statTime .value.low{color:var(--red);animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#statCombo .value{color:var(--orange)}
#statCombo.hot .value{animation:pulse .4s infinite}

/* ── 아주머니 + 말풍선 ─────────────────── */
#ajRow{display:flex;align-items:center;gap:10px;padding:2px 16px;min-height:70px}
#ajImg{width:60px;height:60px;border-radius:50%;border:3px solid #c9a875;background:var(--paper);object-fit:cover;flex:none;box-shadow:0 3px 0 #b8946a}
#bubble{position:relative;background:#fffdf6;border:3px solid #c9a875;border-radius:18px;padding:7px 14px;font-size:19px;color:#5b3a1e;line-height:1.3;max-width:78%}
#bubble::before{content:'';position:absolute;left:-10px;top:17px;width:14px;height:14px;background:#fffdf6;border-left:3px solid #c9a875;border-bottom:3px solid #c9a875;transform:rotate(45deg)}
#bubble.pop{animation:bubblePop .25s ease-out}
@keyframes bubblePop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ── 팬 영역 ─────────────────────────── */
#playArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 16px;min-height:0}
#gaugeWrap{width:min(80vw,360px);margin-bottom:-10px}
#gauge{width:100%;display:block}
#gauge text{font-size:15px;font-family:'Jua';fill:#7a5c3a}
#typeBadge{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;font-size:17px;padding:3px 16px;border-radius:999px;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.2);opacity:0;transition:opacity .2s}
#typeBadge.on{opacity:1}
#panWrap{position:relative;width:min(72vw,340px);aspect-ratio:1;flex:none}
#panImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(80,50,20,.4))}
#panImg.shake{animation:panShake .4s ease-in-out}
@keyframes panShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
#jeonStack{position:absolute;inset:0;transform-origin:center}
#jeonStack.drop{animation:jeonDrop .55s ease-out}
@keyframes jeonDrop{0%{transform:scale(.25);opacity:.4}60%{transform:scale(1.05)}100%{transform:scale(1)}}
#jeonStack.sizzle{animation:sizzleWob .5s ease-in-out infinite}
#jeonStack.sizzle.fast{animation-duration:.26s}
@keyframes sizzleWob{0%,100%{transform:scale(1) rotate(0deg)}30%{transform:scale(1.012) rotate(.5deg)}70%{transform:scale(.998) rotate(-.4deg)}}
#jeonStack.flipGood{animation:flipGood .6s ease-out}
@keyframes flipGood{30%{transform:translateY(-15%) scale(1.06) rotate(7deg)}100%{transform:translateY(0) scale(1)}}
#jeonStack.flipBad{animation:flipBad .5s ease-out}
@keyframes flipBad{30%{transform:translateY(-6%) scale(.98)}100%{transform:translateY(0) scale(1)}}
#jeonStack.burnShake{animation:burnShake .5s ease-in-out}
@keyframes burnShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.jstage{position:absolute;left:50%;top:50%;width:71%;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.steam{position:absolute;width:16px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.8),transparent 70%);
  opacity:0;pointer-events:none}
.steam.s1{left:38%;top:18%}.steam.s2{left:56%;top:22%}.steam.s3{left:47%;top:10%}
.steam.on{animation:steamUp 1.4s ease-out infinite}
.steam.on.s2{animation-delay:.45s}.steam.on.s3{animation-delay:.9s}
@keyframes steamUp{0%{opacity:0;transform:translateY(0) scale(.7)}25%{opacity:.9}100%{opacity:0;transform:translateY(-70px) scale(1.5)}}
.smoke{position:absolute;width:30px;height:40px;border-radius:50%;left:45%;top:12%;
  background:radial-gradient(ellipse,rgba(70,65,60,.75),transparent 70%);opacity:0;pointer-events:none}
.smoke.on{animation:steamUp 1.1s ease-out infinite}
#nowHint{position:absolute;top:-30px;left:50%;transform:translateX(-50%) scale(0);
  background:var(--orange);color:#fff;font-size:21px;padding:5px 18px;border-radius:999px;
  box-shadow:0 3px 0 #c55f0e;transition:transform .15s;z-index:4;white-space:nowrap}
#nowHint.on{transform:translateX(-50%) scale(1);animation:nowPulse .4s infinite}
@keyframes nowPulse{50%{transform:translateX(-50%) scale(1.1)}}

/* 결과 토스트 */
#toast{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:36px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);
  z-index:5;white-space:nowrap;pointer-events:none}
#toast.show{animation:toastPop 1s ease-out forwards}
@keyframes toastPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
#toast.good{color:#ffe28a}
#toast.bad{color:#efe6d8}
#scorePop{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:28px;color:#5da02c;opacity:0;pointer-events:none;z-index:5;text-shadow:0 2px 0 #fff}
#scorePop.show{animation:scoreUp .9s ease-out forwards}
@keyframes scoreUp{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}

/* 화면 플래시 */
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
#flash.good{background:radial-gradient(circle,rgba(255,190,60,.28),transparent 70%);animation:flashA .45s ease-out}
#flash.bad{background:radial-gradient(circle,rgba(60,50,40,.3),transparent 70%);animation:flashA .45s ease-out}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}

/* ── 탭! 원형 버튼 ────────────────────── */
#flipBtn{display:block;width:min(42vw,150px);aspect-ratio:560/518;margin:2px auto 16px;border:none;background:transparent;
  background-image:url('assets/btn-round.webp');background-size:contain;background-repeat:no-repeat;background-position:center;
  color:#fff;font-family:inherit;font-size:46px;letter-spacing:2px;line-height:1;
  text-shadow:0 3px 0 rgba(120,55,0,.6);cursor:pointer;filter:drop-shadow(0 7px 7px rgba(120,60,10,.4))}
#flipBtn:active{transform:scale(.93);filter:drop-shadow(0 2px 3px rgba(120,60,10,.4))}
#flipBtn .sub{display:block;font-size:14px;opacity:.95;margin-top:6px;letter-spacing:0}
#tapHint{text-align:center;font-size:14px;color:#8a6a45;margin-top:-10px;margin-bottom:14px}
#flipBtn:disabled{filter:grayscale(.5) brightness(.92)}

/* 불꽃 */
#flames{position:absolute;inset:-13%;width:126%;height:126%;object-fit:contain;
  pointer-events:none;animation:flick .5s ease-in-out infinite alternate;z-index:0}
@keyframes flick{0%{opacity:.85;transform:scale(1)}100%{opacity:1;transform:scale(1.03)}}

/* 전 선택 카드 */
.selRow{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.typeCard{flex:1;max-width:110px;border:3px solid #d8bd8f;border-radius:16px;padding:8px 6px 9px;
  background:#fdf3df;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s}
.typeCard img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#f0e0c2}
.typeCard .tn{font-size:17px;color:#5b3a1e;margin-top:4px;line-height:1.2}
.typeCard .tt{font-size:12px;color:#a08464;line-height:1.25;margin-top:2px;font-family:'Pretendard','Noto Sans KR',sans-serif;font-weight:600;word-break:keep-all}
.typeCard.sel{border-color:var(--orange);background:#ffeccf;transform:translateY(-4px);box-shadow:0 5px 0 #d8955a}
.card .ajBig{width:104px;height:104px;border-radius:50%;border:3px solid #c9a875;object-fit:cover;margin-top:-58px;background:var(--paper)}
#homeBtn{display:block;margin:10px auto 0;background:none;border:none;color:#8a6a45;font-size:16px;font-family:inherit;cursor:pointer;text-decoration:underline}

/* ── 오버레이 ────────────────────────── */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(60,40,20,.5);backdrop-filter:blur(2px);padding:20px}
.overlay.hidden{display:none}
.card{width:100%;max-width:400px;background:var(--paper);border:3px solid #c9a875;border-radius:26px;
  padding:24px 22px;text-align:center;box-shadow:0 16px 40px rgba(60,40,10,.4)}
.card .titleImg{width:78%;max-width:290px;margin:0 auto 4px;display:block}
.card .stackImg{width:150px;margin:0 auto;display:block}
.card .sub{font-size:19px;color:#8a6a45;margin:6px 0 12px;line-height:1.5}
.typeChips{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.typeChips span{background:#f3e6cc;border:2px solid #d8bd8f;border-radius:999px;padding:5px 14px;font-size:17px;color:#7a5a30}
.bigBtn{display:block;width:100%;height:92px;margin-top:8px;border:none;background:transparent;
  background-size:100% 100%;background-repeat:no-repeat;color:#5b3a1e;font-family:inherit;
  font-size:34px;letter-spacing:1px;cursor:pointer;filter:drop-shadow(0 5px 5px rgba(120,60,10,.3))}
.bigBtn:active{transform:translateY(4px);filter:drop-shadow(0 1px 2px rgba(120,60,10,.3))}
.bigBtn.yellow{background-image:url('assets/btn-wide-yellow.webp')}
.bigBtn.green{background-image:url('assets/btn-wide-green.webp');color:#3f5423}
#endScore{font-size:58px;color:var(--orange);line-height:1.1}
#endCount{font-size:20px;color:#5b3a1e}
#endCombo{font-size:17px;color:#8a6a45;margin-top:2px}
#stars{font-size:40px;letter-spacing:6px;margin:4px 0;color:#e8a52a}
#stars .off{opacity:.25}
.hintLine{font-size:15px;color:#a08464;margin-top:10px;line-height:1.6;font-family:'Pretendard','Noto Sans KR',sans-serif;font-weight:600}

@media (max-height: 720px){
  #hud{padding:8px 12px 4px}
  .stat{padding:3px 2px 5px;border-radius:12px}
  .stat .value{font-size:24px}
  .stat .label{font-size:12px}
  #ajRow{min-height:54px;padding:0 14px}
  #ajImg{width:46px;height:46px}
  #bubble{font-size:16px;padding:5px 12px}
  #gaugeWrap{width:min(64vw,280px,26dvh)}
  #panWrap{width:min(64vw,280px,38dvh)}
  #flipBtn{width:min(34vw,120px);font-size:36px;margin:0 auto 10px}
  #flipBtn .sub{font-size:12px}
  .card{padding:18px 16px;max-height:94dvh;overflow:auto}
  .card .ajBig{margin-top:0;width:88px;height:88px}
  .card .stackImg{width:110px}
  .bigBtn{height:74px;font-size:27px}
  #endScore{font-size:44px}
  #stars{font-size:32px}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><div class="label">점수</div><div class="value" id="vScore">0</div></div>
    <div class="stat" id="statTime"><div class="label">시간</div><div class="value" id="vTime">60</div></div>
    <div class="stat" id="statCombo"><div class="label">콤보</div><div class="value" id="vCombo">0</div></div>
  </header>

  <div id="playArea">
    <div id="gaugeWrap">
      <svg id="gauge" viewBox="0 0 200 136" aria-hidden="true">
        <path id="arcRaw"   fill="none" stroke="#d9c9a8" stroke-width="15" stroke-linecap="round"/>
        <path id="arcGood"  fill="none" stroke="#7cb342" stroke-width="15" stroke-linecap="round"/>
        <path id="arcOver"  fill="none" stroke="#e05b3a" stroke-width="15" stroke-linecap="round"/>
        <circle id="needle" r="9" fill="#fffdf6" stroke="#5b3a1e" stroke-width="3.5"/>
        <text x="100" y="134" text-anchor="middle">익음 정도</text>
      </svg>
    </div>
    <div id="panWrap">
      <div id="typeBadge"></div>
      <div id="nowHint">지금이야!</div>
      <img id="flames" src="assets/flames.webp" alt="">
      <img id="panImg" src="assets/pan.webp" alt="후라이팬">
      <div id="jeonStack">
        <img class="jstage" id="jRaw" alt="">
        <img class="jstage" id="jMid" alt="">
        <img class="jstage" id="jGold" alt="">
        <img class="jstage" id="jBurnt" alt="">
        <div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div>
        <div class="smoke sm1"></div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="scorePop"></div>
  </div>

  <div id="ajRow">
    <img id="ajImg" src="assets/ajumma-happy.webp" alt="전집 아주머니">
    <div id="bubble">노릇노릇해지면 눌러요!</div>
  </div>

  <button id="flipBtn" type="button">탭!<span class="sub">뒤집기</span></button>
</div>
<div id="flash"></div>

<div class="overlay" id="startOv">
  <div class="card">
    <img class="ajBig" src="assets/ajumma-happy.webp" alt="전집 아주머니">
    <img class="titleImg" src="assets/title.webp" alt="전 뒤집기">
    <p class="sub">오늘은 어떤 전을 부칠까요?</p>
    <div class="selRow" id="selRow">
      <div class="typeCard sel" data-t="buchu"><img src="assets/buchu-gold.webp" alt=""><div class="tn">부추전</div><div class="tt">보통 속도<br>넉넉한 타이밍</div></div>
      <div class="typeCard" data-t="kimchi"><img src="assets/kimchi-gold.webp" alt=""><div class="tn">김치전</div><div class="tt">색이 진해<br>살짝 헷갈림</div></div>
      <div class="typeCard" data-t="haemul"><img src="assets/haemul-gold.webp" alt=""><div class="tn">해물전</div><div class="tt">천천히 익고<br>타이밍 짧음</div></div>
    </div>
    <button class="bigBtn yellow" id="startBtn" type="button">시작하기</button>
    <p class="hintLine">60초 동안 노릇노릇할 때 딱 한 번!<br>너무 빨리 누르면 덜 익고, 늦으면 타버려요</p>
  </div>
</div>

<div class="overlay hidden" id="endOv">
  <div class="card">
    <h1 id="endTitle" style="font-size:38px">오늘 전 <span id="endJeon" style="color:var(--orange)">0</span>장!</h1>
    <div id="stars"></div>
    <img class="stackImg" id="endStack" src="assets/jeon-stack.webp" alt="">
    <div id="endScore">0</div>
    <div id="endCount">점수</div>
    <div id="endCombo"></div>
    <button class="bigBtn green" id="retryBtn" type="button">다시 하기</button>
    <button id="homeBtn" type="button">처음으로</button>
  </div>
</div>

<script>
'use strict';
/* ═══════════ 사운드 (WebAudio 합성) ═══════════ */
const Sfx=(()=>{let ctx=null,master=null,crackleBuf=null,cookGain=null,cookSrc=null;
function ensure(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);}
if(ctx.state==='suspended')ctx.resume();}
function noiseBuf(dur){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
// 지글지글 루프용 버퍼: 잡음 + 랜덤 튀는 팝
function crackle(dur){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
let e=0;for(let i=0;i<n;i++){if(Math.random()<.0035)e=1;e*=.994;
d[i]=(Math.random()*2-1)*(.06+e*.55);}return b;}
function pop(t,vol,f){const s=ctx.createBufferSource();s.buffer=noiseBuf(.03);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);}
// 반죽 부을 때 "치익~"
function pourSizzle(dur=.9,vol=.55){if(!ctx)return;const t=ctx.currentTime;
const s=ctx.createBufferSource();s.buffer=noiseBuf(dur);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(5200,t);
bp.frequency.exponentialRampToValueAtTime(3400,t+dur);bp.Q.value=.8;
const g=ctx.createGain();g.gain.setValueAtTime(.001,t);
g.gain.exponentialRampToValueAtTime(vol,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+dur);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
const pops=Math.floor(dur*40);for(let i=0;i<pops;i++)pop(t+Math.random()*dur,vol*(.3+Math.random()*.7),3000+Math.random()*5000);
const ls=ctx.createBufferSource();ls.buffer=noiseBuf(dur*.7);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
const lg=ctx.createGain();lg.gain.setValueAtTime(.001,t);lg.gain.exponentialRampToValueAtTime(vol*.35,t+.08);
lg.gain.exponentialRampToValueAtTime(.001,t+dur*.7);
ls.connect(lp);lp.connect(lg);lg.connect(master);ls.start(t);}
// 익는 동안 잔잔한 지글거림 루프
function cookStart(){if(!ctx)return;cookStop();
crackleBuf=crackleBuf||crackle(2.5);
cookSrc=ctx.createBufferSource();cookSrc.buffer=crackleBuf;cookSrc.loop=true;
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4200;bp.Q.value=.7;
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;
cookGain=ctx.createGain();cookGain.gain.value=0;
cookSrc.connect(bp);bp.connect(lp);lp.connect(cookGain);cookGain.connect(master);cookSrc.start();}
function cookVol(v){if(cookGain&&ctx)cookGain.gain.setTargetAtTime(v,ctx.currentTime,.1);}
function cookStop(){if(cookSrc){try{cookSrc.stop();}catch(e){}cookSrc=null;cookGain=null;}}
// 뒤집기: 휙 + 팬에 착
function flip(){if(!ctx)return;const t=ctx.currentTime;
const s=ctx.createBufferSource();s.buffer=noiseBuf(.12);
const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(1600,t);
bp.frequency.exponentialRampToValueAtTime(500,t+.12);bp.Q.value=1.5;
const g=ctx.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t);
const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(200,t+.05);
o.frequency.exponentialRampToValueAtTime(70,t+.17);
const og=ctx.createGain();og.gain.setValueAtTime(.5,t+.05);og.gain.exponentialRampToValueAtTime(.001,t+.19);
o.connect(og);og.connect(master);o.start(t+.05);o.stop(t+.2);
pop(t+.06,.5,1400);}
function good(){if(!ctx)return;const t=ctx.currentTime;[660,880].forEach((f,i)=>{
const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
const g=ctx.createGain();const st=t+.07*i;g.gain.setValueAtTime(.001,st);
g.gain.exponentialRampToValueAtTime(.28,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.25);
o.connect(g);g.connect(master);o.start(st);o.stop(st+.3);});}
function bad(){if(!ctx)return;const t=ctx.currentTime;
const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(180,t);
o.frequency.exponentialRampToValueAtTime(80,t+.35);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;
const g=ctx.createGain();g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+.42);}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
return{ensure,pourSizzle,cookStart,cookVol,cookStop,flip,good,bad,vibrate};})();

/* ═══════════ 전 종류 ═══════════ */
const TYPES=[
 {id:'buchu',name:'부추전',cookMs:4200,win:[.60,.80]},
 {id:'kimchi',name:'김치전',cookMs:3800,win:[.64,.78]},
 {id:'haemul',name:'해물전',cookMs:5200,win:[.70,.81]},
];

const $=id=>document.getElementById(id);
const vScore=$('vScore'),vTime=$('vTime'),vCombo=$('vCombo'),statTime=$('statTime'),statCombo=$('statCombo');
const bubble=$('bubble'),ajImg=$('ajImg'),typeBadge=$('typeBadge');
const panImg=$('panImg'),jeonStack=$('jeonStack'),panWrap=$('panWrap'),nowHint=$('nowHint');
const stages={raw:$('jRaw'),mid:$('jMid'),gold:$('jGold'),burnt:$('jBurnt')};
const toastEl=$('toast'),scorePop=$('scorePop'),flashEl=$('flash');
const startOv=$('startOv'),endOv=$('endOv');

const IMG={happy:'assets/ajumma-happy.webp',worried:'assets/ajumma-worried.webp',surprised:'assets/ajumma-surprised.webp'};

/* 게이지 arc */
const GA={cx:100,cy:100,r:72,a0:155,a1:385}; // deg, 상단을 크게 도는 호
function arcPath(t0,t1){const rad=d=>d*Math.PI/180;
const x0=GA.cx+GA.r*Math.cos(rad(GA.a0+(GA.a1-GA.a0)*t0));
const y0=GA.cy+GA.r*Math.sin(rad(GA.a0+(GA.a1-GA.a0)*t0));
const x1=GA.cx+GA.r*Math.cos(rad(GA.a0+(GA.a1-GA.a0)*t1));
const y1=GA.cy+GA.r*Math.sin(rad(GA.a0+(GA.a1-GA.a0)*t1));
const laf=(t1-t0)*(GA.a1-GA.a0)>180?1:0;return`M ${x0} ${y0} A ${GA.r} ${GA.r} 0 ${laf} 1 ${x1} ${y1}`;}
function needleAt(p){const rad=d=>d*Math.PI/180,a=GA.a0+(GA.a1-GA.a0)*p;
return[GA.cx+GA.r*Math.cos(rad(a)),GA.cy+GA.r*Math.sin(rad(a))];}
function drawGauge(win){$('arcRaw').setAttribute('d',arcPath(.02,win[0]));
$('arcGood').setAttribute('d',arcPath(win[0],win[1]));
$('arcOver').setAttribute('d',arcPath(win[1],.98));}
function setNeedle(p){const[x,y]=needleAt(Math.max(0,Math.min(1,p)));
const n=$('needle');n.setAttribute('cx',x);n.setAttribute('cy',y);}

/* 익음 단계 크로스페이드 */
const ss=(a,b,x)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
function showStages(p,w0){
 stages.raw.style.opacity=1-ss(.30,.45,p);
 stages.mid.style.opacity=ss(.30,.45,p)*(1-ss(w0-.06,w0+.04,p));
 stages.gold.style.opacity=ss(w0-.06,w0+.04,p)*(1-ss(.84,.97,p));
 stages.burnt.style.opacity=ss(.84,.97,p);}
function forceStage(name){for(const k in stages)stages[k].style.opacity=k===name?1:0;}

/* ═══════════ 게임 상태 ═══════════ */
const G={playing:false,score:0,combo:0,best:0,count:0,timeLeft:60,
 jeon:null,selType:TYPES[0],lastTs:0,raf:0};

const BUB={
 start:'노릇노릇해지면 눌러요!',
 wait:['조금만 더~','아직이에요~','기다려요~'],
 good:['잘 뒤집었어요!','노릇노릇~','완벽해요!','아주 맛있겠어요!'],
 early:['어이구, 덜 익었어요','조금 일렀어요~'],
 burnt:['아이고 탔어요 ㅠㅠ','타버렸네…','아까워라…']};
const pick=a=>a[Math.floor(Math.random()*a.length)];

let faceT=0;
function say(txt,face){bubble.textContent=txt;bubble.classList.remove('pop');void bubble.offsetWidth;
bubble.classList.add('pop');
if(face){ajImg.src=IMG[face];clearTimeout(faceT);
 faceT=setTimeout(()=>ajImg.src=IMG.happy,1600);}}

function toast(txt,cls){toastEl.textContent=txt;toastEl.className='';
void toastEl.offsetWidth;toastEl.className='show '+(cls||'');}
function popScore(n){scorePop.textContent='+'+n;scorePop.className='';
void scorePop.offsetWidth;scorePop.className='show';}
function flash(cls){flashEl.className='';void flashEl.offsetWidth;flashEl.className=cls;}

/* ── 한 장 사이클 ── */
function nextJeon(){
 const type=G.selType;
 G.jeon={type,phase:'oil',t0:performance.now(),p:0,warned:false};
 typeBadge.textContent=type.name;typeBadge.classList.add('on');
 for(const s in stages){stages[s].src=`assets/${type.id}-${s}.webp`;stages[s].style.opacity=0;}
 jeonStack.className='';nowHint.classList.remove('on');
 jeonStack.querySelectorAll('.steam,.smoke').forEach(s=>s.classList.remove('on'));
 drawGauge(type.win);setNeedle(0);
 Sfx.cookVol(.06);
 say(pick(['자, 새 전 부칠게요~',type.name+' 나갑니다~','기름 달궈졌어요~']));
 setTimeout(()=>{if(G.jeon&&G.jeon.phase==='oil'){G.jeon.phase='pour';G.jeon.t0=performance.now();
  Sfx.pourSizzle(.9,.5);jeonStack.classList.add('drop');
  stages.raw.style.opacity=1;}},650);}

function resolveJeon(result){ // 'good' | 'early' | 'burnt'
 const j=G.jeon;if(!j||j.resolved)return;j.resolved=true;j.phase='done';j.doneT=performance.now();
 nowHint.classList.remove('on');
 panImg.classList.add('shake');setTimeout(()=>panImg.classList.remove('shake'),450);
 if(result==='good'){
  G.combo++;G.best=Math.max(G.best,G.combo);G.count++;
  const pts=100+(G.combo-1)*20;G.score+=pts;
  jeonStack.classList.add('flipGood');forceStage('gold');
  toast(pick(['노릇노릇~','잘 뒤집었어요!']),'good');say(pick(BUB.good),'happy');
  popScore(pts);flash('good');Sfx.flip();Sfx.good();Sfx.vibrate(40);
  if(G.combo>=2){toast('콤보 x'+G.combo+'!','good');statCombo.classList.add('hot');}
  Sfx.cookVol(.12);
 }else if(result==='early'){
  G.combo=0;statCombo.classList.remove('hot');
  jeonStack.classList.add('flipBad');forceStage('mid');
  toast('덜 익었어요','bad');say(pick(BUB.early),'surprised');
  flash('bad');Sfx.flip();Sfx.bad();Sfx.vibrate([60,40,60]);Sfx.cookVol(.03);
 }else{
  G.combo=0;statCombo.classList.remove('hot');
  jeonStack.classList.add('burnShake');forceStage('burnt');
  toast('아이고 탔어요 ㅠㅠ','bad');say(pick(BUB.burnt),'worried');
  flash('bad');Sfx.bad();Sfx.vibrate([120,60,120]);Sfx.cookVol(.02);
 }
 vScore.textContent=G.score;vCombo.textContent=G.combo;
 setTimeout(()=>{if(G.playing)nextJeon();},1150);}

/* ── 탭 처리 ── */
function onTap(){
 if(!G.playing)return;
 const j=G.jeon;if(!j||j.resolved)return;
 if(j.phase!=='cook')return;
 const p=j.p,w=j.type.win;
 if(p<w[0]*.7){ // 너무 이름 → 경고만
  if(!j.warned){j.warned=true;say(pick(BUB.wait),'surprised');toast('아직이에요~','bad');}
  return;}
 if(p<w[0])resolveJeon('early');
 else if(p<=w[1])resolveJeon('good');
 else resolveJeon('burnt');}

/* ── 메인 루프 ── */
function frame(ts){
 if(!G.playing)return;
 const dt=ts-G.lastTs;G.lastTs=ts;
 G.timeLeft-=dt/1000;
 const tl=Math.max(0,Math.ceil(G.timeLeft));
 vTime.textContent=tl;
 statTime.querySelector('.value').classList.toggle('low',tl<=10&&tl>0);
 if(G.timeLeft<=0){endGame();return;}
 const j=G.jeon;
 if(j&&!j.resolved){
  const el=ts-j.t0;
  if(j.phase==='pour'){
   j.p=0;if(el>=700){j.phase='cook';j.t0=ts;jeonStack.classList.add('sizzle');}
  }else if(j.phase==='cook'){
   j.p=el/j.type.cookMs;
   const p=j.p,w=j.type.win;
   showStages(p,w[0]);
   setNeedle(p);
   // 김치전은 색 헷갈림 → 지금이야 힌트 표시 안함
   const inWin=p>=w[0]&&p<=w[1];
   nowHint.classList.toggle('on',inWin&&j.type.id!=='kimchi');
   jeonStack.classList.toggle('fast',inWin);
   jeonStack.querySelectorAll('.steam').forEach(s=>s.classList.toggle('on',p>w[0]*.75&&p<.93));
   jeonStack.querySelectorAll('.smoke').forEach(s=>s.classList.toggle('on',p>=.93));
   Sfx.cookVol(p<w[0]?.08+p*.1:p<=w[1]?.22:.3);
   if(p>=1){resolveJeon('burnt');}
  }
 }
 G.raf=requestAnimationFrame(frame);}

/* ── 게임 시작/끝 ── */
function startGame(){
 Sfx.ensure();
 G.playing=true;G.score=0;G.combo=0;G.best=0;G.count=0;G.timeLeft=60;
 vScore.textContent='0';vCombo.textContent='0';vTime.textContent='60';
 statCombo.classList.remove('hot');
 startOv.classList.add('hidden');endOv.classList.add('hidden');
 $('flipBtn').disabled=false;
 Sfx.cookStart();
 nextJeon();
 G.lastTs=performance.now();G.raf=requestAnimationFrame(frame);}
function endGame(){
 G.playing=false;cancelAnimationFrame(G.raf);Sfx.cookStop();
 nowHint.classList.remove('on');typeBadge.classList.remove('on');
 $('endJeon').textContent=G.count;
 $('endScore').textContent=G.score;
 $('endCombo').textContent='최고 콤보 x'+G.best;
 const n=G.count>=15?3:G.count>=9?2:1;
 $('stars').innerHTML=[1,2,3].map(i=>`<span class="${i<=n?'':'off'}">★</span>`).join('');
 say(n>=2?'와~ 정말 잘 부쳤어요!':'다음엔 더 잘할 거예요!');
 endOv.classList.remove('hidden');}

/* ── 이벤트 ── */
document.addEventListener('pointerdown',e=>{
 if(e.target.closest('.overlay')||e.target.closest('#flipBtn'))return;
 onTap();},{passive:true});
$('flipBtn').addEventListener('pointerdown',e=>{e.preventDefault();onTap();});
$('startBtn').addEventListener('click',startGame);
$('retryBtn').addEventListener('click',startGame);
$('homeBtn').addEventListener('click',()=>{endOv.classList.add('hidden');startOv.classList.remove('hidden');
say(BUB.start);});
document.querySelectorAll('.typeCard').forEach(c=>{
 c.addEventListener('pointerdown',()=>{
  document.querySelectorAll('.typeCard').forEach(x=>x.classList.remove('sel'));
  c.classList.add('sel');
  G.selType=TYPES.find(t=>t.id===c.dataset.t);});});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
